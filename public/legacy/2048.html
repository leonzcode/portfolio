<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LEON Merge</title>
<link rel="stylesheet" href="/legacy/mp/mp.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#faf8ef;
  display:flex;justify-content:center;align-items:center;
}

/* ── Mode Select ── */
.mode-screen{
  display:flex;flex-direction:column;align-items:center;
  gap:20px;padding:30px;
}
.mode-screen h1{font-size:clamp(40px,10vmin,64px);font-weight:800;color:#776e65;letter-spacing:3px}
.mode-screen p{font-size:clamp(12px,2.2vmin,16px);color:#8f7a66}
.mode-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.mode-btn{
  background:#bbada0;border:none;color:#f9f6f2;
  font-size:clamp(16px,3vmin,22px);font-weight:700;
  padding:16px 32px;border-radius:10px;cursor:pointer;
  transition:background .15s;min-width:140px;
}
.mode-btn:hover{background:#9f8b77}
.mode-btn.accent{background:#f2b179}
.mode-btn.accent:hover{background:#e5a468}

/* ── Game wrapper ── */
.game-wrapper{display:none;flex-direction:column;align-items:center;width:100%;height:100%;overflow:hidden}

/* ── Top bar (shared) ── */
.top-bar{
  display:flex;justify-content:center;align-items:center;
  gap:10px;padding:6px 12px;width:100%;flex-wrap:wrap;
}
.top-bar .title{font-size:clamp(20px,4vmin,32px);font-weight:800;color:#776e65;letter-spacing:2px}
.top-bar .tb-btn{
  background:#8f7a66;border:none;color:#f9f6f2;
  font-size:11px;font-weight:700;padding:6px 12px;
  border-radius:5px;cursor:pointer;
}
.top-bar .tb-btn:hover{background:#9f8b77}

/* ── Players area ── */
.players-area{
  display:flex;gap:12px;justify-content:center;align-items:flex-start;
  flex:1;min-height:0;padding:4px 8px;width:100%;
}
.player-col{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:0;flex:1;max-width:480px;
}
.player-label{
  font-size:clamp(11px,1.8vmin,15px);font-weight:700;color:#776e65;
}
.player-label span{font-weight:400;color:#8f7a66;font-size:.85em}
.score-row{display:flex;gap:4px;justify-content:center}
.score-box{
  background:#bbada0;border-radius:5px;padding:3px 8px;
  text-align:center;min-width:42px;
}
.score-label{display:block;font-size:7px;font-weight:700;color:#eee4da;text-transform:uppercase;letter-spacing:.5px}
.score-value{display:block;font-size:clamp(11px,2vmin,16px);font-weight:700;color:#fff}

/* ── Board ── */
.board{
  background:#bbada0;border-radius:8px;
  position:relative;overflow:hidden;
  touch-action:none;flex-shrink:0;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.board.dead{opacity:.55;pointer-events:none}
.board.winner{box-shadow:0 0 0 3px #ffd740,0 4px 20px rgba(0,0,0,.08)}
.cell-bg{position:absolute;border-radius:5px;background:rgba(238,228,218,.35)}

/* ── Tiles ── */
.tile{
  position:absolute;border-radius:5px;
  display:flex;justify-content:center;align-items:center;
  font-weight:800;color:#f9f6f2;z-index:2;
  transition:transform .12s cubic-bezier(.25,.1,.25,1);
  will-change:transform;user-select:none;top:0;left:0;
}
.tile-L{background:#7ec8e3}
.tile-E{background:#81c784}
.tile-O{background:#ffb74d}
.tile-N{background:#f48fb1}
.tile-LE{background:#4db6ac}
.tile-EO{background:#aed581}
.tile-ON{background:#e57373}
.tile-LEO{background:#26a69a}
.tile-EON{background:#ef5350}
.tile-LEON{
  background:linear-gradient(135deg,#ffd740,#ffab00);
  color:#5d4e37;box-shadow:0 0 14px rgba(255,193,7,.5);
}
.tile-BLOCK{
  background:#9e9e9e;color:rgba(255,255,255,.7);
  box-shadow:inset 0 0 8px rgba(0,0,0,.15);
}
.tile-block-land{animation:blockLand .35s ease forwards}
@keyframes blockLand{
  0%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
  60%{transform:translate(var(--tx),var(--ty)) scale(1.12);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:1}
}
.tile-new{animation:appear 90ms ease forwards}
.tile-pop{animation:pop 110ms ease forwards}
.tile-leon-born{animation:leonBorn .6s ease forwards;z-index:3}
@keyframes appear{
  0%{transform:translate(var(--tx),var(--ty)) scale(.6);opacity:0}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:1}
}
@keyframes pop{
  0%{transform:translate(var(--tx),var(--ty)) scale(.85)}
  50%{transform:translate(var(--tx),var(--ty)) scale(1.08)}
  100%{transform:translate(var(--tx),var(--ty)) scale(1)}
}
@keyframes leonBorn{
  0%{transform:translate(var(--tx),var(--ty)) scale(.8);box-shadow:0 0 8px rgba(255,193,7,.4)}
  40%{transform:translate(var(--tx),var(--ty)) scale(1.22);box-shadow:0 0 28px rgba(255,193,7,.8)}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);box-shadow:0 0 14px rgba(255,193,7,.5)}
}

/* ── Info bar ── */
.info{
  font-size:clamp(9px,1.5vmin,12px);color:#8f7a66;
  text-align:center;padding:2px 8px;line-height:1.4;
}
.info strong{color:#776e65}

/* ── Overlay ── */
.overlay{
  position:fixed;inset:0;background:rgba(238,228,218,.65);
  z-index:100;display:none;justify-content:center;align-items:center;
  backdrop-filter:blur(2px);
}
.overlay.show{display:flex}
.ov-box{
  background:#fff;border-radius:12px;padding:28px 36px;
  text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12);max-width:90vw;
}
.ov-box h2{font-size:clamp(22px,5vmin,32px);color:#776e65;margin-bottom:8px}
.ov-box p{font-size:14px;color:#8f7a66;margin-bottom:16px}
.ov-box button{
  background:#8f7a66;border:none;color:#f9f6f2;
  font-size:14px;font-weight:700;padding:10px 24px;
  border-radius:6px;cursor:pointer;margin:0 6px;
}
.ov-box button:hover{background:#9f8b77}
.ov-box button.primary{background:#f2b179}
.ov-box button.primary:hover{background:#e5a468}

/* ── 1P layout ── */
.game-wrapper.mode-1p .players-area{flex-direction:column;align-items:center}
.game-wrapper.mode-1p .player-col{max-width:500px}
.game-wrapper.mode-1p .board{
  --bsz:min(88vw,50vh,450px);
  width:var(--bsz);height:var(--bsz);
}

/* ── 2P layout ── */
.game-wrapper.mode-2p .players-area{flex-direction:row;align-items:flex-start}
.game-wrapper.mode-2p .board{
  --bsz:min(44vw,50vh,360px);
  width:var(--bsz);height:var(--bsz);
}
@media(max-width:640px){
  .game-wrapper.mode-2p .players-area{flex-direction:column;align-items:center}
  .game-wrapper.mode-2p .board{
    --bsz:min(80vw,36vh,320px);
    width:var(--bsz);height:var(--bsz);
  }
}
</style>
</head>
<body>

<!-- ── Mode Select Screen ── -->
<div class="mode-screen" id="mode-screen">
  <h1>LEON</h1>
  <p>Merge letters to build <strong>LEON</strong></p>
  <div class="mode-btns">
    <button class="mode-btn accent" id="btn-1p">1 Player</button>
    <button class="mode-btn" id="btn-2p">2 Players</button>
  </div>
  <p style="font-size:clamp(10px,1.6vmin,12px);opacity:.7">
    <strong>L+E=LE</strong> · <strong>E+O=EO</strong> · <strong>O+N=ON</strong> · <strong>→ LEO → EON → LEON</strong>
  </p>
</div>

<!-- ── Game Wrapper ── -->
<div class="game-wrapper" id="game-wrapper">
  <div class="top-bar">
    <span class="title">LEON</span>
    <button class="tb-btn" id="btn-new">New Game</button>
    <button class="tb-btn" id="btn-menu">Menu</button>
  </div>
  <div class="players-area" id="players-area"></div>
  <div class="info" id="info-bar"></div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-box">
    <h2 id="ov-title"></h2>
    <p id="ov-msg"></p>
    <button class="primary" id="ov-new">Play Again</button>
    <button id="ov-menu">Menu</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   LEON Merge – 1P & 2P 2048-style letter game
   ═══════════════════════════════════════════ */
const GRID = 4;
const SLIDE_MS = 120;
const LETTERS = ['L','E','O','N'];

const MERGE_TABLE = {
  'L+E':'LE','E+L':'LE',
  'E+O':'EO','O+E':'EO',
  'O+N':'ON','N+O':'ON',
  'LE+O':'LEO','O+LE':'LEO',
  'L+EO':'LEO','EO+L':'LEO',
  'EO+N':'EON','N+EO':'EON',
  'E+ON':'EON','ON+E':'EON',
  'LEO+N':'LEON','N+LEO':'LEON',
  'L+EON':'LEON','EON+L':'LEON'
};
const POINTS = {'LE':10,'EO':10,'ON':10,'LEO':30,'EON':30,'LEON':50};

function tryMerge(a,b){
  if(a==='LEON'||b==='LEON'||a==='BLOCK'||b==='BLOCK') return null;
  return MERGE_TABLE[a+'+'+b]||null;
}

/* ────────────────────────────────────────
   Player class – each player has own board
   ──────────────────────────────────────── */
class Player {
  constructor(idx, boardEl, scoreEl, leonEl) {
    this.idx = idx;
    this.boardEl = boardEl;
    this.scoreEl = scoreEl;
    this.leonEl = leonEl;
    this.grid = null;
    this.tileEls = {};
    this.nextId = 1;
    this.score = 0;
    this.leonCount = 0;
    this.animating = false;
    this.dead = false;
    this.boardPx = 0; this.gap = 0; this.pad = 0; this.cellSz = 0;
  }

  recalc() {
    this.boardPx = this.boardEl.clientWidth;
    this.gap = Math.round(this.boardPx * 0.028);
    this.pad = this.gap;
    this.cellSz = (this.boardPx - this.pad*2 - this.gap*(GRID-1)) / GRID;
  }
  posT(r){ return this.pad + r*(this.cellSz+this.gap); }
  posL(c){ return this.pad + c*(this.cellSz+this.gap); }
  fsize(v){
    if(v.length<=1) return this.cellSz*0.48;
    if(v.length<=2) return this.cellSz*0.38;
    return this.cellSz*0.26;
  }

  drawBg(){
    this.boardEl.querySelectorAll('.cell-bg').forEach(e=>e.remove());
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++){
        const d=document.createElement('div');
        d.className='cell-bg';
        d.style.cssText=`width:${this.cellSz}px;height:${this.cellSz}px;top:${this.posT(r)}px;left:${this.posL(c)}px`;
        this.boardEl.appendChild(d);
      }
  }

  createTileEl(tile,r,c){
    const el=document.createElement('div');
    el.className='tile tile-'+tile.value;
    el.textContent=tile.value;
    const tx=this.posL(c)+'px', ty=this.posT(r)+'px';
    el.style.cssText=`width:${this.cellSz}px;height:${this.cellSz}px;--tx:${tx};--ty:${ty};transform:translate(${tx},${ty});font-size:${this.fsize(tile.value)}px;line-height:${this.cellSz}px`;
    this.boardEl.appendChild(el);
    this.tileEls[tile.id]=el;
    el.addEventListener('animationend',()=>{
      el.classList.remove('tile-new','tile-pop','tile-leon-born');
    });
    return el;
  }

  spawn(){
    const empty=[];
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++)
        if(!this.grid[r][c]) empty.push({r,c});
    if(!empty.length) return;
    const cell=empty[Math.floor(Math.random()*empty.length)];
    const tile={id:this.nextId++, value:LETTERS[Math.floor(Math.random()*4)]};
    this.grid[cell.r][cell.c]=tile;
    const el=this.createTileEl(tile,cell.r,cell.c);
    el.classList.add('tile-new');
  }

  getLines(dir){
    const lines=[];
    for(let i=0;i<GRID;i++){
      const line=[];
      for(let j=0;j<GRID;j++){
        if(dir==='left')  line.push({r:i,c:j});
        if(dir==='right') line.push({r:i,c:GRID-1-j});
        if(dir==='up')    line.push({r:j,c:i});
        if(dir==='down')  line.push({r:GRID-1-j,c:i});
      }
      lines.push(line);
    }
    return lines;
  }

  doMove(dir){
    const lines=this.getLines(dir);
    let anyMoved=false;
    const slides={}, merges=[], toRemove=new Set();
    for(const line of lines){
      const tiles=[];
      for(const{r,c}of line) if(this.grid[r][c]) tiles.push({...this.grid[r][c],or:r,oc:c});
      for(const{r,c}of line) this.grid[r][c]=null;
      const result=[];
      let i=0;
      while(i<tiles.length){
        if(i+1<tiles.length){
          const merged=tryMerge(tiles[i].value,tiles[i+1].value);
          if(merged){
            const dest=line[result.length];
            const nt={id:this.nextId++,value:merged};
            slides[tiles[i].id]={r:dest.r,c:dest.c};
            slides[tiles[i+1].id]={r:dest.r,c:dest.c};
            toRemove.add(tiles[i].id);
            toRemove.add(tiles[i+1].id);
            merges.push({newTile:nt,dr:dest.r,dc:dest.c});
            this.grid[dest.r][dest.c]=nt;
            result.push(nt);
            this.score+=(POINTS[merged]||0);
            if(merged==='LEON') this.leonCount++;
            anyMoved=true;
            i+=2; continue;
          }
        }
        const dest=line[result.length];
        slides[tiles[i].id]={r:dest.r,c:dest.c};
        if(tiles[i].or!==dest.r||tiles[i].oc!==dest.c) anyMoved=true;
        this.grid[dest.r][dest.c]={id:tiles[i].id,value:tiles[i].value};
        result.push(tiles[i]);
        i++;
      }
    }
    return {anyMoved,slides,merges,toRemove};
  }

  move(dir){
    if(this.animating||this.dead) return;
    const{anyMoved,slides,merges,toRemove}=this.doMove(dir);
    if(!anyMoved) return;
    this.animating=true;
    this.updateDisplay();
    for(const[id,dest]of Object.entries(slides)){
      const el=this.tileEls[id];
      if(el){
        const tx=this.posL(dest.c)+'px', ty=this.posT(dest.r)+'px';
        el.style.setProperty('--tx',tx);
        el.style.setProperty('--ty',ty);
        el.style.transform=`translate(${tx},${ty})`;
      }
    }
    setTimeout(()=>{
      for(const id of toRemove){
        if(this.tileEls[id]){this.tileEls[id].remove();delete this.tileEls[id];}
      }
      // Track which merges produced LEON
      const leonMerges=[];
      for(const m of merges){
        const el=this.createTileEl(m.newTile,m.dr,m.dc);
        el.classList.add(m.newTile.value==='LEON'?'tile-leon-born':'tile-pop');
        if(m.newTile.value==='LEON') leonMerges.push(m);
      }
      this.spawn();
      this.updateDisplay();

      // 2P mechanic: LEON disappears from maker, gray BLOCK lands on opponent
      if(mode===2&&leonMerges.length>0){
        const opponent=players[this.idx===0?1:0];
        setTimeout(()=>{
          for(const m of leonMerges){
            // Remove LEON from this player's board
            const t=this.grid[m.dr][m.dc];
            if(t&&this.tileEls[t.id]){
              this.tileEls[t.id].remove();
              delete this.tileEls[t.id];
            }
            this.grid[m.dr][m.dc]=null;
            // Place gray BLOCK on opponent
            if(!opponent.dead) opponent.placeBlock();
          }
          this.animating=false;
          if(this.isGameOver()){this.dead=true;this.boardEl.classList.add('dead');checkGameEnd();}
          if(opponent.isGameOver()){opponent.dead=true;opponent.boardEl.classList.add('dead');checkGameEnd();}
        },650); // wait for LEON birth animation
      } else {
        this.animating=false;
        if(this.isGameOver()){
          this.dead=true;
          this.boardEl.classList.add('dead');
          checkGameEnd();
        }
      }
    },SLIDE_MS+20);
  }

  isGameOver(){
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++)
        if(!this.grid[r][c]) return false;
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++){
        const v=this.grid[r][c].value;
        if(c+1<GRID&&tryMerge(v,this.grid[r][c+1].value)) return false;
        if(r+1<GRID&&tryMerge(v,this.grid[r+1][c].value)) return false;
      }
    return true;
  }

  placeBlock(){
    const empty=[];
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++)
        if(!this.grid[r][c]) empty.push({r,c});
    if(!empty.length) return;
    const cell=empty[Math.floor(Math.random()*empty.length)];
    const tile={id:this.nextId++,value:'BLOCK'};
    this.grid[cell.r][cell.c]=tile;
    const el=this.createTileEl(tile,cell.r,cell.c);
    el.textContent='LEON';
    el.classList.add('tile-block-land');
    el.addEventListener('animationend',()=>{el.classList.remove('tile-block-land');});
  }

  updateDisplay(){
    this.scoreEl.textContent=this.score;
    this.leonEl.textContent=this.leonCount;
  }

  reset(){
    Object.values(this.tileEls).forEach(e=>e.remove());
    this.grid=Array.from({length:GRID},()=>Array(GRID).fill(null));
    this.tileEls={};
    this.nextId=1;
    this.score=0;
    this.leonCount=0;
    this.animating=false;
    this.dead=false;
    this.boardEl.classList.remove('dead','winner');
    this.recalc();
    this.drawBg();
    this.spawn();
    this.spawn();
    this.updateDisplay();
  }

  resize(){
    this.recalc();
    this.drawBg();
    for(let r=0;r<GRID;r++)
      for(let c=0;c<GRID;c++){
        if(!this.grid[r][c]) continue;
        const el=this.tileEls[this.grid[r][c].id];
        if(el){
          const tx=this.posL(c)+'px', ty=this.posT(r)+'px';
          el.style.transition='none';
          el.style.width=this.cellSz+'px';
          el.style.height=this.cellSz+'px';
          el.style.setProperty('--tx',tx);
          el.style.setProperty('--ty',ty);
          el.style.transform=`translate(${tx},${ty})`;
          el.style.fontSize=this.fsize(this.grid[r][c].value)+'px';
          el.style.lineHeight=this.cellSz+'px';
          requestAnimationFrame(()=>{el.style.transition='';});
        }
      }
  }
}

/* ────────────────────────────────────
   Game controller
   ──────────────────────────────────── */
const modeScreen  = document.getElementById('mode-screen');
const gameWrapper  = document.getElementById('game-wrapper');
const playersArea  = document.getElementById('players-area');
const infoBar      = document.getElementById('info-bar');
const overlay      = document.getElementById('overlay');
const ovTitle      = document.getElementById('ov-title');
const ovMsg        = document.getElementById('ov-msg');
const ovNew        = document.getElementById('ov-new');
const ovMenu       = document.getElementById('ov-menu');

let mode = 0; // 1 or 2
let players = [];

function showOverlay(title,msg){
  ovTitle.textContent=title;
  ovMsg.textContent=msg;
  overlay.classList.add('show');
}
function hideOverlay(){overlay.classList.remove('show');}

function buildPlayerCol(idx, label, keys){
  const col=document.createElement('div');
  col.className='player-col';

  const lbl=document.createElement('div');
  lbl.className='player-label';
  lbl.innerHTML=label+' <span>('+keys+')</span>';
  col.appendChild(lbl);

  const sr=document.createElement('div');
  sr.className='score-row';
  sr.innerHTML=`
    <div class="score-box"><span class="score-label">Score</span><span class="score-value" id="sc-${idx}">0</span></div>
    <div class="score-box"><span class="score-label">LEONs</span><span class="score-value" id="lc-${idx}">0</span></div>
  `;
  col.appendChild(sr);

  const board=document.createElement('div');
  board.className='board';
  board.id='board-'+idx;
  col.appendChild(board);

  return col;
}

function startGame(numPlayers){
  mode=numPlayers;
  players=[];
  modeScreen.style.display='none';
  gameWrapper.style.display='flex';
  gameWrapper.className='game-wrapper mode-'+mode+'p';
  playersArea.innerHTML='';
  hideOverlay();

  if(mode===1){
    const col=buildPlayerCol(0,'','Arrow keys / WASD');
    playersArea.appendChild(col);
    infoBar.innerHTML='<strong>L+E=LE</strong> · <strong>E+O=EO</strong> · <strong>O+N=ON</strong> · <strong>→ LEO → EON → LEON</strong>';
    const p=new Player(0,
      document.getElementById('board-0'),
      document.getElementById('sc-0'),
      document.getElementById('lc-0')
    );
    players.push(p);
    // Let board render, then init
    requestAnimationFrame(()=>{ p.reset(); });
  } else {
    const col1=buildPlayerCol(0,'Player 1','WASD');
    const col2=buildPlayerCol(1,'Player 2','Arrows');
    playersArea.appendChild(col1);
    playersArea.appendChild(col2);
    infoBar.innerHTML='<strong>P1:</strong> WASD &nbsp;&nbsp; <strong>P2:</strong> Arrow keys &nbsp;&nbsp;|&nbsp;&nbsp; First to most LEONs wins!';
    const p1=new Player(0,
      document.getElementById('board-0'),
      document.getElementById('sc-0'),
      document.getElementById('lc-0')
    );
    const p2=new Player(1,
      document.getElementById('board-1'),
      document.getElementById('sc-1'),
      document.getElementById('lc-1')
    );
    players.push(p1,p2);
    requestAnimationFrame(()=>{ p1.reset(); p2.reset(); });
  }
}

function checkGameEnd(){
  if(mode===1){
    if(players[0].dead){
      showOverlay('Game Over','Score: '+players[0].score+'  |  LEONs: '+players[0].leonCount);
    }
  } else {
    const allDead=players.every(p=>p.dead);
    if(allDead){
      const s0=players[0].leonCount, s1=players[1].leonCount;
      let winner;
      if(s0>s1) winner='Player 1 wins!';
      else if(s1>s0) winner='Player 2 wins!';
      else {
        // Tiebreak by score
        if(players[0].score>players[1].score) winner='Player 1 wins!';
        else if(players[1].score>players[0].score) winner='Player 2 wins!';
        else winner="It's a tie!";
      }
      const w = s0>s1?0:(s1>s0?1:(players[0].score>=players[1].score?0:1));
      if(s0!==s1||players[0].score!==players[1].score) players[w].boardEl.classList.add('winner');
      showOverlay(winner,
        'P1: '+players[0].score+' pts, '+s0+' LEONs  |  P2: '+players[1].score+' pts, '+s1+' LEONs');
    }
  }
}

function newGame(){
  hideOverlay();
  players.forEach(p=>p.reset());
}

function backToMenu(){
  hideOverlay();
  gameWrapper.style.display='none';
  modeScreen.style.display='flex';
  playersArea.innerHTML='';
  players=[];
  mode=0;
}

/* ── Input: keyboard ── */
window.addEventListener('keydown', e=>{
  if(mode===0) return;

  // In 1P mode, both WASD and arrows control the single board
  if(mode===1){
    const map={
      ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
      w:'up',a:'left',s:'down',d:'right',
      W:'up',A:'left',S:'down',D:'right'
    };
    if(map[e.key]){e.preventDefault();players[0].move(map[e.key]);}
    return;
  }

  // 2P: WASD = P1, Arrows = P2
  const p1map={w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
  const p2map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(p1map[e.key]){e.preventDefault();players[0].move(p1map[e.key]);}
  if(p2map[e.key]){e.preventDefault();players[1].move(p2map[e.key]);}
});

/* ── Input: touch swipe (1P only or first board in 2P) ── */
let touchTarget=null, touchX=0, touchY=0;
document.addEventListener('touchstart', e=>{
  if(!mode) return;
  const t=e.target.closest('.board');
  if(!t) return;
  touchTarget=t;
  touchX=e.touches[0].clientX;
  touchY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend', e=>{
  if(!touchTarget||!mode) return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;
  if(Math.abs(dx)<30&&Math.abs(dy)<30){touchTarget=null;return;}
  const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  // Find which player owns this board
  const p=players.find(p=>p.boardEl===touchTarget);
  if(p) p.move(dir);
  touchTarget=null;
},{passive:true});

/* ── Buttons ── */
document.getElementById('btn-1p').addEventListener('click',()=>startGame(1));
document.getElementById('btn-2p').addEventListener('click',()=>startGame(2));
document.getElementById('btn-new').addEventListener('click',newGame);
document.getElementById('btn-menu').addEventListener('click',backToMenu);
ovNew.addEventListener('click',newGame);
ovMenu.addEventListener('click',backToMenu);

/* ── Resize ── */
window.addEventListener('resize',()=>{players.forEach(p=>p.resize());});
</script>
