// Pull the full global ski-area list from OpenSkiMap (daily-updated GeoJSON).
// Every ski area has properties.name + a geometry; we reduce each to a
// searchable {name, lon, lat, region} record and merge with the seed list,
// skipping near-duplicate names so the curated entries win.
const SKI_AREAS_URLS = [
  "https://tiles.openskimap.org/geojson/ski_areas.geojson",
  "https://tiles.skimap.org/geojson/ski_areas.geojson"   // legacy mirror
];
function geomCentroid(g){
  if(!g) return null;
  if(g.type==="Point") return g.coordinates;
  // average all coordinate pairs (good enough to fly to)
  let sx=0,sy=0,n=0;
  (function walk(a){ if(typeof a[0]==="number"){ sx+=a[0]; sy+=a[1]; n++; } else a.forEach(walk); })(g.coordinates);
  return n?[sx/n,sy/n]:null;
}
async function loadAllSkiAreas(){
  let fc=null;
  for(const url of SKI_AREAS_URLS){
    try{ const r=await fetch(url); if(r.ok){ fc=await r.json(); break; } }catch(e){ /* try next */ }
  }
  if(!fc||!fc.features) return;                 // offline/blocked: keep seed list
  const haveNames=new Set(SKI_RESORTS.map(c=>norm(c.name)));
  const extra=[];
  for(const f of fc.features){
    const p=f.properties||{};
    // names can live under several keys depending on dataset version
    const name = p.name || p.title ||
      (Array.isArray(p.names)&&p.names[0]) ||
      (p.tags&&p.tags.name) || null;
    if(!name) continue;
    const key=norm(name);
    if(haveNames.has(key)) continue;            // curated entry already covers it
    const c=geomCentroid(f.geometry); if(!c) continue;

    // region label: try the localized location object, then flat fields
    let region="";
    const loc=p.location||{};
    const en=(loc.localized&&(loc.localized.en||loc.localized["en-US"]))||loc;
    const parts=[en.locality||loc.locality, en.region||loc.region, en.country||loc.country]
      .filter(Boolean);
    region=parts.join(", ") || p.region || p.country || "Ski area";

    haveNames.add(key);
    extra.push({name,lon:c[0],lat:c[1],region,ski:true,local:true});
  }
  if(extra.length){
    SKI_RESORTS = SKI_RESORTS.concat(extra);
    resortsDirty=true;
    if(dataInited && map.getSource("resorts")){ map.getSource("resorts").setData(resortLabelFC()); resortsDirty=false; }
    // refresh current suggestions if the user is mid-search
    if(q.value.trim()) renderSuggestions(localMatches(q.value.trim()).slice(0,7), q.value.trim());
  }
}

const q = document.getElementById("q");
const ac = document.getElementById("ac");
const searchBox = document.getElementById("searchBox");

// common ski-area abbreviations / nicknames -> canonical query
const ALIASES = {
  "wb":"whistler blackcomb","jh":"jackson hole","cham":"chamonix",
  "kitz":"kitzbühel","breck":"breckenridge","abasin":"arapahoe basin",
  "a-basin":"arapahoe basin","val d isere":"val d'isère","valdisere":"val d'isère",
  "st anton":"st. anton","stanton":"st. anton","mammoth":"mammoth mountain",
  "snowbird utah":"snowbird","the 3 valleys":"les trois vallées","3 vallees":"les trois vallées"
};

// strip accents so "soelden"/"solden" match "Sölden", "are" matches "Åre"
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['’.]/g,"").trim(); }

// Levenshtein edit distance (capped) for typo tolerance
function editDistance(a,b){
  a=norm(a); b=norm(b);
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>4) return 99;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
// does query appear as an ordered subsequence of text? (handles shortenings)
function isSubsequence(qq,t){
  qq=norm(qq).replace(/\s/g,""); t=norm(t);
  let i=0; for(let j=0;j<t.length&&i<qq.length;j++){ if(t[j]===qq[i]) i++; }
  return i===qq.length;
}

// Unified candidate shape: {name, region, lon, lat, ski, local}.
// score a candidate against the user's raw query (higher = better)
function score(query, c){
  const qy=norm(query);
  const nm=norm(c.name);
  const full=norm(c.name+" "+(c.region||""));
  let s = c.local ? 22 : (c.importance||0)*10;   // bias built-in resorts up

  if(nm===qy) s+=120;
  else if(nm.startsWith(qy)) s+=80;
  else if(nm.includes(qy)) s+=50;
  else if(full.includes(qy)) s+=28;

  const qwords=qy.split(/\s+/).filter(Boolean);
  const nwords=full.split(/\s+/);
  let wordHits=0;
  for(const qw of qwords){
    if(nwords.some(w=>w.startsWith(qw))) wordHits++;
    else if(nwords.some(w=>editDistance(qw,w)<=1)) wordHits+=0.6;
  }
  s += (wordHits/Math.max(qwords.length,1))*45;

  if(isSubsequence(qy,nm)) s+=16;

  const d=editDistance(qy, nm.slice(0,qy.length+3));
  if(d<=2) s+=32-(d*9);

  if(c.ski) s+=18;
  return s;
}

// instant, offline matches from the resort gazetteer.
// Cheap prefilter first (substring or shared prefix), then expensive scoring
// only on survivors — keeps it fast even with ~12k ski areas loaded.
function localMatches(raw){
  const qy=norm(ALIASES[norm(raw)]||raw);
  if(!qy) return [];
  const q0=qy.slice(0,2);
  const pre=[];
  for(const c of SKI_RESORTS){
    const nm=c._n||(c._n=norm(c.name));
    if(nm.includes(qy) || nm.startsWith(q0) || nm.split(" ").some(w=>w.startsWith(q0)))
      pre.push(c);
  }
  // if the prefilter is too aggressive (typo in 1st 2 chars), fall back to all
  const pool = pre.length ? pre : SKI_RESORTS;
  return pool
    .map(c=>({c,sc:score(qy,c)}))
    .filter(x=>x.sc>=48)            // keep only strong matches (cuts noise)
    .sort((a,b)=>b.sc-a.sc)
    .slice(0,7)
    .map(x=>x.c);
}

let acItems=[], selIdx=-1, seq=0, debTimer=null, lastQ="";

// normalize a Nominatim record into our unified candidate shape
function fromNominatim(p){
  const name=(p.namedetails&&p.namedetails.name)||p.display_name.split(",")[0];
  const region=p.display_name.split(",").slice(1,4).join(",").trim();
  const t=(p.type||"")+" "+(p.class||"")+" "+p.display_name.toLowerCase();
  return { name, region, lon:+p.lon, lat:+p.lat,
           ski:/ski|piste|resort|aerialway/.test(t), local:false,
           importance:p.importance||0 };
}

async function fetchSuggestions(raw){
  const myseq=++seq;

  // 1) INSTANT: built-in resort gazetteer (no network) — show immediately
  let merged = localMatches(raw);
  renderSuggestions(merged.slice(0,7), raw);

  // 2) LIVE: Nominatim for the long tail; merged in when it returns
  searchBox.classList.add("loading");
  const expanded = ALIASES[norm(raw)] || raw;
  const url="https://nominatim.openstreetmap.org/search"+
    "?format=json&namedetails=1&dedupe=1&limit=12&q="+encodeURIComponent(expanded);
  let remote=[];
  try{
    const r=await fetch(url,{headers:{"Accept":"application/json"}});
    remote=(await r.json()).map(fromNominatim);
  }catch(e){ /* offline / CORS: local results already shown */ }
  if(myseq!==seq) return;                       // superseded by a newer keystroke
  searchBox.classList.remove("loading");

  // combine, drop remote dupes of a local resort (by proximity + name), rank
  const out=[...merged];
  const haveNames=new Set(merged.map(c=>norm(c.name)));
  for(const c of remote){
    const dupeName=haveNames.has(norm(c.name));
    const dupeNear=merged.some(m=>Math.abs(m.lat-c.lat)<0.15&&Math.abs(m.lon-c.lon)<0.15);
    if(!dupeName&&!dupeNear){ out.push(c); haveNames.add(norm(c.name)); }
  }
  const ranked=out.map(c=>({c,sc:score(raw,c)})).sort((a,b)=>b.sc-a.sc).slice(0,7).map(x=>x.c);
  renderSuggestions(ranked, raw);
}

function highlight(name, raw){
  const i=norm(name).indexOf(norm(raw));
  if(i<0||!raw.trim()) return escapeHtml(name);
  return escapeHtml(name.slice(0,i))+"<mark>"+escapeHtml(name.slice(i,i+raw.trim().length))+"</mark>"+escapeHtml(name.slice(i+raw.trim().length));
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function pinFor(c){ return c.ski ? "⛷️" : "📍"; }

function renderSuggestions(list, raw){
  acItems=list; selIdx=-1;
  if(!list.length){
    ac.innerHTML='<div class="ac-empty">No matches. Try a different spelling or a nearby town.</div>';
    ac.classList.add("show"); q.setAttribute("aria-expanded","true");
    return;
  }
  ac.innerHTML=list.map((c,i)=>{
    return `<div class="ac-item" role="option" data-i="${i}">
      <span class="pin">${pinFor(c)}</span>
      <span class="txt">
        <div class="name">${highlight(c.name,raw)}</div>
        <div class="ctx">${escapeHtml(c.region||"")}</div>
      </span></div>`;
  }).join("");
  ac.classList.add("show"); q.setAttribute("aria-expanded","true");
  ac.querySelectorAll(".ac-item").forEach(el=>{
    el.addEventListener("mousedown",ev=>{ ev.preventDefault(); choose(+el.dataset.i); });
  });
}

function choose(i){
  const c=acItems[i]; if(!c) return;
  q.value=c.name;
  closeAc();
  map.flyTo({center:[c.lon,c.lat],zoom:13.2,pitch:is3D?62:0,bearing:map.getBearing(),speed:1.3,curve:1.5});
  // Start loading the DESTINATION's features right now, so they're already on
  // the map (or arriving) by the time the fly animation lands — no need to pan.
  loadSkiData({lon:c.lon,lat:c.lat});
}
function closeAc(){ ac.classList.remove("show"); q.setAttribute("aria-expanded","false"); selIdx=-1; }
function setSel(n){
  const els=ac.querySelectorAll(".ac-item");
  if(!els.length) return;
  selIdx=(n+els.length)%els.length;
  els.forEach((e,i)=>e.classList.toggle("sel",i===selIdx));
  els[selIdx].scrollIntoView({block:"nearest"});
}

q.addEventListener("input",()=>{
  const v=q.value.trim();
  q.placeholder="Search ski areas…";
  clearTimeout(debTimer);
  if(v.length<1){ closeAc(); searchBox.classList.remove("loading"); return; }
  if(v===lastQ) return; lastQ=v;
  // instant offline render of resort matches on every keystroke...
  renderSuggestions(localMatches(v).slice(0,7), v);
  // ...then a debounced live fetch to enrich with the long tail
  if(v.length>=2) debTimer=setTimeout(()=>fetchSuggestions(v),220);
});
q.addEventListener("keydown",e=>{
  if(!ac.classList.contains("show")){
    if(e.key==="Enter"&&q.value.trim()){ fetchSuggestions(q.value.trim()); }
    return;
  }
  if(e.key==="ArrowDown"){ e.preventDefault(); setSel(selIdx+1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); setSel(selIdx-1); }
  else if(e.key==="Enter"){ e.preventDefault(); choose(selIdx>=0?selIdx:0); }
  else if(e.key==="Escape"){ closeAc(); }
});
q.addEventListener("focus",()=>{ if(acItems.length&&q.value.trim()) ac.classList.add("show"); });
document.addEventListener("click",e=>{ if(!searchBox.contains(e.target)) closeAc(); });
document.querySelector(".search .ic").style.cursor="pointer";
document.querySelector(".search .ic").addEventListener("click",()=>{ if(q.value.trim()) fetchSuggestions(q.value.trim()); });

// Load the full OpenSkiMap ski-area gazetteer in the background (after all
// search helpers are defined). Until it arrives, the seed list serves results.
loadAllSkiAreas();
</script>
