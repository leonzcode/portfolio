<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Leoncraft 2</title>
<!-- asked for at once rather than one after another: the game's code beside three.js, and the
     textures while the code loads (main.js asks for the same addresses, stamps and all) -->
<link rel="modulepreload" href="../legacy/vendor/three-0.163.0.module.js">
<link rel="modulepreload" href="js/main.js?v=30">
<link rel="preload" href="textures/manifest.json?v=30" as="fetch" crossorigin>
<link rel="preload" href="textures/terrain_albedo.png?v=30" as="fetch" crossorigin>
<link rel="preload" href="textures/items.png?v=30" as="fetch" crossorigin>
<link rel="preload" href="textures/colormap_grass.png?v=30" as="fetch" crossorigin>
<link rel="preload" href="textures/colormap_foliage.png?v=30" as="fetch" crossorigin>
<script>
  // the workers that make the world, started at once so their code loads beside the page's (world.js startWorkers takes them)
  try {
    const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1)) + 1;
    const src = 'js/worker.js?v=30';
    window.__lc2Workers = Array.from({ length: n }, () => new Worker(src, { type: 'module' }));
    /* and they start on the title screen's world at once, each its share (worker.js startPre): its seed and where
       it stands are main.js's MENU_SEED and its spot. On a first visit to this version they make it; when its
       chunks are kept from a visit before (world.js lc2_kept), they only read back the columns they meshed then
       (warm). Not when the page goes straight back into a world, or ?at= moves the title; and on a machine of
       fewer than four cores only the reading back: making it there would take the page's own start away from it. */
    const kept = JSON.parse(localStorage.getItem('lc2_kept') || 'null');
    const warm = !!kept && String(kept.v).startsWith('c' + src.split('?v=')[1] + '.') && kept.keys.some(k => /\|overworld\|classic\|20261002$/.test(k));
    // (its columns meshed with Video Settings as settings.js worldOpts will give them)
    const o = JSON.parse(localStorage.getItem('lc2_options') || 'null') || {};
    const opts = { fast: o.cutoutLeaves === false, blend: typeof o.biomeBlend === 'number' ? o.biomeBlend : 2, flat: o.smoothLighting === false };
    if ((warm || (navigator.hardwareConcurrency || 4) >= 4) && !sessionStorage.getItem('lc2_resume') && !new URLSearchParams(location.search).get('at'))
      window.__lc2Workers.forEach((w, i) => w.postMessage({ type: 'pregen', seed: 20261002, generator: 'classic', dim: 'overworld', at: [1101, 771], r: 3, i, n, opts, warm }));
  } catch (e) { /* world.js starts them */ }
</script>
<script>
  // Detailed graphics also reads the material map: asked for now too, unless Fast is chosen
  try {
    const o = JSON.parse(localStorage.getItem('lc2_options') || 'null') || {}, q = new URLSearchParams(location.search).get('q') || o.quality;
    if (q !== 'fast' && q !== 'potato') {
      const l = document.createElement('link');
      l.rel = 'preload'; l.as = 'fetch'; l.crossOrigin = 'anonymous'; l.href = 'textures/terrain_spec.png?v=30';
      document.head.appendChild(l);
    }
  } catch (e) { /* main.js asks for it in any case */ }
</script>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gui { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* the first few seconds, before the menus have loaded: a plain screen with a bar */
  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #1d1b19;
    font: 600 15px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e2d6; }
  #loading .box { width: min(440px, 80vw); text-align: center; }
  #loading .name { font-size: 28px; letter-spacing: 6px; margin-bottom: 18px; }
  #loading .bar { height: 10px; border: 2px solid #e8e2d6; padding: 2px; margin-top: 12px; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #e8e2d6; transition: width 0.3s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gui"></canvas>
<div id="loading"><div class="box"><div class="name">LEONCRAFT</div><div id="status">Loading…</div><div class="bar"><i id="bar"></i></div></div></div>
<script type="module">
  import * as THREE from '../legacy/vendor/three-0.163.0.module.js';
  window.THREE = THREE;
  await import('./js/main.js?v=30');
</script>
</body>
</html>
