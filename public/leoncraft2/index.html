<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leoncraft 2</title>
<!-- what the workers need for the title's world, asked for at once (the page's own code and big
     textures are asked for below, by the first script; main.js asks for the same addresses, stamps and all) -->
<link rel="preload" href="textures/manifest.json?v=107" as="fetch" crossorigin>
<link rel="preload" href="textures/colormap_grass.png?v=107" as="fetch" crossorigin>
<link rel="preload" href="textures/colormap_foliage.png?v=107" as="fetch" crossorigin>
<script>
  // the workers that make the world, started at once so their code loads beside the page's (world.js startWorkers takes them)
  try {
    const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 4) - 1)) + 1;
    const src = 'js/worker.js?v=107';
    window.__lc2Workers = Array.from({ length: n }, () => new Worker(src, { type: 'module' }));
    /* and they start on the title screen's world at once, each its share (worker.js startPre): its seed and where
       it stands are main.js's MENU_SEED and its spot. On a first visit to this version they make it; when its
       chunks are kept from a visit before (world.js lc2_kept), they only read back the columns they meshed then
       (warm). Not when the page goes straight back into a world, or ?at= moves the title; and on a machine of
       fewer than four cores only the reading back: making it there would take the page's own start away from it. */
    const kept = JSON.parse(localStorage.getItem('lc2_kept') || 'null');
    const warm = !!kept && String(kept.v).startsWith('c' + src.split('?v=')[1] + '.') && kept.keys.some(k => /\|overworld\|classic\|20261002$/.test(k));
    // (its columns meshed with Video Settings as settings.js worldOpts will give them)
    const o = JSON.parse(localStorage.getItem('lc2_options') || 'null') || {};
    const opts = { fast: o.cutoutLeaves === false, blend: typeof o.biomeBlend === 'number' ? o.biomeBlend : 2, flat: o.smoothLighting === false };
    const making = !warm && (navigator.hardwareConcurrency || 4) >= 4;
    if ((warm || making) && !sessionStorage.getItem('lc2_resume') && !new URLSearchParams(location.search).get('at')) {
      window.__lc2Workers.forEach((w, i) => w.postMessage({ type: 'pregen', seed: 20261002, generator: 'classic', dim: 'overworld', at: [1101, 771], r: 3, i, n, opts, warm }));
      /* On a first visit (nothing kept to read back) the workers' code comes first: everything else the
         page loads waits until the first worker has its own (worker.js says 'up'), at most a second and a
         half. On a slow line it was the other way round: the workers' code, five imports deep, came in
         last behind the page's 2 MB, and they began on the title's world only as the page itself was ready
         (the title then waited on them, about a second at 10 Mbps). The page can do nothing before its
         code is all in; the workers can make the ground meanwhile. */
      if (making) window.__lc2Up = new Promise(res => {
        const t = setTimeout(res, 1500);
        for (const w of window.__lc2Workers) w.addEventListener('message', function up(e) {
          if (e.data && e.data.type === 'up') { w.removeEventListener('message', up); clearTimeout(t); res(); }
        });
      });
    }
  } catch (e) { /* world.js starts them */ }
  // the page's own code and big textures, asked for at once (when the workers' code is in, on a first visit)
  window.__lc2Go = () => {
    const add = (rel, href, as) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (as) { l.as = as; l.crossOrigin = 'anonymous'; } document.head.appendChild(l); };
    add('modulepreload', '../legacy/vendor/three-0.163.0.module.js');
    add('modulepreload', 'js/main.js?v=107');
    add('preload', 'textures/terrain_albedo.png?v=107', 'fetch');
    add('preload', 'textures/items.png?v=107', 'fetch');
    // Detailed graphics also reads the material map: asked for now too, unless Fast is chosen
    try {
      const o = JSON.parse(localStorage.getItem('lc2_options') || 'null') || {}, q = new URLSearchParams(location.search).get('q') || o.quality;
      if (q !== 'fast' && q !== 'potato') add('preload', 'textures/terrain_spec.png?v=107', 'fetch');
    } catch (e) { /* main.js asks for it in any case */ }
  };
</script>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gui { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* the first few seconds, before the menus have loaded: a plain screen with a bar */
  #loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #1d1b19;
    font: 600 15px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e2d6; }
  #loading .box { width: min(440px, 80vw); text-align: center; }
  #loading .name { font-size: 28px; letter-spacing: 6px; margin-bottom: 18px; }
  #loading .bar { height: 10px; border: 2px solid #e8e2d6; padding: 2px; margin-top: 12px; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #e8e2d6; transition: width 0.3s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gui"></canvas>
<div id="loading"><div class="box"><div class="name">LEONCRAFT</div><div id="status">Loading…</div><div class="bar"><i id="bar"></i></div></div></div>
<script type="module">
  if (window.__lc2Up) await window.__lc2Up;
  if (window.__lc2Go) window.__lc2Go();
  window.THREE = await import('../legacy/vendor/three-0.163.0.module.js');
  await import('./js/main.js?v=107');
</script>
</body>
</html>
