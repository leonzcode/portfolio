      rank.style.color = "var(--dim)";
      rank.style.width = "1%";
      tr.appendChild(rank);
      var who = el("td");
      var sw = el("span", "sw");
      sw.style.background = colorOf(r.name);
      who.appendChild(sw);
      who.appendChild(document.createTextNode(i === B.you ? r.name + " (you)" : r.name));
      if (r.done) who.appendChild(el("span", "b-fin", "finished"));
      tr.appendChild(who);
      tr.appendChild(el("td", "num", r.solved + " of " + total));
      var last = r.ts.length ? (Math.round(r.ts[r.ts.length - 1] * 10) / 10) + " min" : "not yet";
      tr.appendChild(el("td", "num", last));
      tb.appendChild(tr);
    });
    if (!rows.length) {
      var tr0 = el("tr");
      var td0 = el("td", null, "No hunters yet.");
      td0.colSpan = 4;
      td0.style.color = "var(--dim)";
      tr0.appendChild(td0);
      tb.appendChild(tr0);
    }
    table.appendChild(tb);
    split.appendChild(table);

    var qr = el("div", "b-qr");
    qr.appendChild(qrSvg());
    qr.appendChild(el("div", "cap", "Scan to join the hunt on a phone"));
    qr.appendChild(el("div", "url", "leonzhao.dev/form"));
    split.appendChild(qr);

    node.appendChild(split);
  }

  // The standings live in two places, and both are refreshed the moment the
  // server says anything changed.
  function paintBoard() {
    var a = $("board");
    if (a) boardInto(a);
    var b = $("eboard");
    if (b) boardInto(b);
  }

  /* ====================================================================== */
  /*  the editor                                                            */
  /* ====================================================================== */

  var previewing = false;
  var signinError = "";
  var pendingPw = "";

  function openEditor() {
    if (E.form) { mode = "editor"; paint(); return; }
    mode = "signin"; signinError = ""; paint();
  }
  function typingInEditor() {
    var a = document.activeElement;
    return !!(a && $("edit").contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName));
  }
  function formsMark(size) {
    var box = el("div");
    box.style.cssText = "width:" + size + "px;height:" + size + "px;border-radius:" + Math.round(size / 5) +
      "px;background:var(--theme);display:grid;place-items:center;flex:none;";
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("width", String(Math.round(size * .62)));
    s.setAttribute("height", String(Math.round(size * .62)));
    s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("fill", "#fff");
    p.setAttribute("d", "M17 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2zm-6.6 13.1L7.5 13.2l1.1-1.1 1.8 1.8 4.1-4.1 1.1 1.1-5.2 5.2zM16 8H8V6.6h8V8z");
    s.appendChild(p);
    box.appendChild(s);
    return box;
  }

  function paintSignin() {
    var root = $("edit");
    root.innerHTML = "";
    var wrap = el("div", "e-in-wrap");
    var card = el("div", "e-signin");
    var mark = formsMark(48);
    mark.style.margin = "0 auto";
    card.appendChild(mark);
    card.appendChild(el("h2", null, "Editor sign-in"));
    card.appendChild(el("p", null, "The editor password opens the questions, the answers and the settings for everybody at once."));
    var fld = el("div", "fld");
    var inp = el("input");
    inp.type = "password"; inp.placeholder = "Password"; inp.autocomplete = "current-password";
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    fld.appendChild(inp);
    card.appendChild(fld);
    card.appendChild(el("div", "bad-msg", signinError));
    var go2 = el("div", "go");
    var back = el("button", "e-ghost", "Back to the form");
    back.type = "button";
    back.addEventListener("click", function () { mode = "view"; paint(); });
    var next = el("button", "f-btn", "Sign in");
    next.type = "button";
    next.addEventListener("click", go);
    go2.appendChild(back); go2.appendChild(next);
    card.appendChild(go2);
    wrap.appendChild(card);
    root.appendChild(wrap);
    setTimeout(function () { inp.focus(); }, 30);

    function go() {
      var pw = inp.value;
      if (!pw) { signinError = "Type the password first."; paintSignin(); return; }
      pendingPw = pw;
      signinError = "";
      if (!send({ type: "login", pw: pw })) { signinError = "Not connected yet. Try again in a moment."; paintSignin(); }
    }
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  // Two forms are the same when the questions, the settings and the wording are the
  // same. The version and the timestamp move on every save and say nothing.
  function sameForm(a, b) {
    if (!a || !b) return false;
    var x = clone(a), y = clone(b);
    x.version = y.version = 0; x.updatedAt = y.updatedAt = 0;
    return JSON.stringify(x) === JSON.stringify(y);
  }

  // A change that arrived while the editor was busy lands as soon as it goes quiet.
  function applyQueued() {
    if (!E.queued || E.dirty || E.saving || typingInEditor()) return;
    if (sameForm(E.form, E.queued)) { E.queued = null; return; }
    E.form = clone(E.queued);
    E.queued = null;
    if (mode === "editor") paintEditor();
  }
  setInterval(function () { if (mode === "editor") applyQueued(); }, 2500);

  function markDirty() {
    E.dirty = true;
    var s = $("esave");
    if (s) s.textContent = "Saving...";
    clearTimeout(markDirty.t);
    markDirty.t = setTimeout(saveNow, 700);
  }
  function saveNow() {
    if (!E.form) return;
    clearTimeout(markDirty.t);
    E.dirty = false; E.saving = true;
    send({ type: "save", form: E.form });
    var s = $("esave");
    if (s) s.textContent = "All changes saved";
    // if the acknowledgement never lands (a dropped socket), stop treating the
    // editor as busy for ever
    setTimeout(function () { E.saving = false; }, 3000);
    // anything that arrived while we were typing gets applied once we stop
    setTimeout(applyQueued, 1200);
  }

  function paintTabsOnly() {
    var t = $("tab-r");
    if (t) t.querySelector(".pill").textContent = String(E.players.length);
  }

  function paintEditor() {
    if (previewing) { previewing = false; }
    var root = $("edit");
    if (!E.form) { paintSignin(); return; }
    applyTheme(E.form.theme);
    var keep = document.activeElement && document.activeElement.id;
    var keepPos = null;
    if (keep && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      try { keepPos = document.activeElement.selectionStart; } catch (e) {}
    }
    root.innerHTML = "";

    /* --- app bar --- */
    var bar = el("div", "e-bar");
    var logo = formsMark(40);
    bar.appendChild(logo);
    var nameBox = el("div", "e-name");
    var ti = el("input");
    ti.id = "edoctitle";
    ti.value = E.form.title;
    ti.setAttribute("aria-label", "Form title");
    ti.addEventListener("input", function () { E.form.title = ti.value; markDirty(); });
    nameBox.appendChild(ti);
    var saved = el("div", "e-saved", E.dirty ? "Saving..." : "All changes saved");
    saved.id = "esave";
    nameBox.appendChild(saved);
    bar.appendChild(nameBox);
    var acts = el("div", "e-acts");
    var prev = iconBtn(ICON.eye, "Preview the form");
    prev.addEventListener("click", function () { previewing = true; mode = "view"; paint(); });
    acts.appendChild(prev);
    var out = el("button", "e-ghost", "Sign out");
    out.type = "button";
    out.addEventListener("click", function () {
      sessionStorage.removeItem("form_pw");
      send({ type: "logout" });
      E.form = null; mode = "view"; paint();
    });
    acts.appendChild(out);
    bar.appendChild(acts);
    root.appendChild(bar);

    /* --- tabs --- */
    var tabs = el("div", "e-tabs");
    [["q", "Questions", 0], ["r", "Responses", E.players.length], ["s", "Settings", 0]].forEach(function (t) {
      var b = el("button", "e-tab" + (E.tab === t[0] ? " on" : ""), t[1]);
      b.type = "button";
      b.id = "tab-" + t[0];
      if (t[0] === "r") { var pill = el("span", "pill", String(t[2])); b.appendChild(pill); }
      b.addEventListener("click", function () { E.tab = t[0]; paintEditor(); });
      tabs.appendChild(b);
    });
    root.appendChild(tabs);

    var body = el("div", "e-body");
    if (E.tab === "q") paintQuestionsTab(body);
    else if (E.tab === "r") paintResponsesTab(body);
    else paintSettingsTab(body);
    root.appendChild(body);
    if (E.tab === "r") { fillResponses(); paintBoard(); }

    if (keep) {
      var again = $(keep);
      if (again && again.focus) {
        again.focus();
        if (keepPos !== null && again.setSelectionRange) { try { again.setSelectionRange(keepPos, keepPos); } catch (e) {} }
      }
    }
  }

  /* ---------- questions tab ---------- */

  function autogrow(t) {
    t.style.height = "auto";
    t.style.height = (t.scrollHeight) + "px";
  }
  function growInput(cls, id, value, placeholder, onInput) {
    var t = el("textarea", "e-in " + cls);
    t.rows = 1;
    t.id = id;
    t.value = value || "";
    t.placeholder = placeholder;
    t.addEventListener("input", function () { autogrow(t); onInput(t.value); });
    setTimeout(function () { autogrow(t); }, 0);
    return t;
  }

  function paintQuestionsTab(body) {
    var f = E.form;

    // header card
    var head = el("div", "e-card head");
    head.appendChild(el("div", "f-band"));
    var inner = el("div", "in");
    inner.appendChild(growInput("big", "ehtitle", f.title, "Form title", function (v) { f.title = v; var d = $("edoctitle"); if (d) d.value = v; markDirty(); }));
    inner.appendChild(growInput("", "ehdesc", f.description, "Form description", function (v) { f.description = v; markDirty(); }));
    head.appendChild(inner);
    body.appendChild(head);

    if (!f.questions.length) {
      var empty = el("div", "e-card");
      empty.appendChild(el("div", "e-empty", "No questions yet. Use the + button to add the first one."));
      body.appendChild(empty);
    }

    f.questions.forEach(function (q, i) { body.appendChild(questionCard(q, i)); });

    var fab = el("div", "e-fab");
    var add = iconBtn(ICON.add, "Add question");
    add.addEventListener("click", function () { addQuestion(); });
    fab.appendChild(add);
    body.appendChild(fab);
  }

  function newId() { return "q" + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36); }
  function addQuestion(after) {
    var q = { id: newId(), type: "short", title: "", help: "", hint: "", image: "", imgAr: 0,
              options: [], answers: [], correct: [], cooldownMs: null, caseSensitive: null };
    var at = (after === undefined || after < 0) ? E.form.questions.length : after + 1;
    E.form.questions.splice(at, 0, q);
    E.sel = q.id;
    saveNow();
    paintEditor();
    setTimeout(function () { var n = $("t_" + q.id); if (n) n.focus(); }, 40);
  }

  function questionCard(q, i) {
    var card = el("div", "e-card" + (E.sel === q.id ? " sel" : ""));
    card.id = "qc_" + q.id;
    // Selecting a card only moves the accent bar. It must not repaint the editor:
    // the repaint would tear out the very textarea or menu button the click was
    // landing on, and the click would go nowhere.
    card.addEventListener("mousedown", function () {
      if (E.sel === q.id) return;
      E.sel = q.id;
      var all = document.querySelectorAll("#edit .e-card.sel");
      for (var i2 = 0; i2 < all.length; i2++) all[i2].classList.remove("sel");
      card.classList.add("sel");
    });
    card.draggable = false;

    var grab = el("div", "e-grab");
    grab.appendChild(svg(ICON.grab));
    grab.title = "Drag to reorder";
    grab.addEventListener("mousedown", function () { card.draggable = true; });
    grab.addEventListener("mouseup", function () { card.draggable = false; });
    card.appendChild(grab);
    card.addEventListener("dragstart", function (ev) {
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", String(i));
      card.classList.add("drag");
    });
    card.addEventListener("dragend", function () { card.classList.remove("drag"); card.draggable = false; });
    card.addEventListener("dragover", function (ev) { ev.preventDefault(); card.classList.add("over"); });
    card.addEventListener("dragleave", function () { card.classList.remove("over"); });
    card.addEventListener("drop", function (ev) {
      ev.preventDefault();
      card.classList.remove("over");
      var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
      if (isNaN(from) || from === i) return;
      var moved = E.form.questions.splice(from, 1)[0];
      E.form.questions.splice(i, 0, moved);
      saveNow(); paintEditor();
    });

    // title + type
    var top = el("div", "e-top");
    var l = el("div", "l");
    l.appendChild(growInput("q", "t_" + q.id, q.title, "Question", function (v) { q.title = v; markDirty(); }));
    l.appendChild(growInput("small", "h_" + q.id, q.help, "Description (optional)", function (v) { q.help = v; markDirty(); }));
    top.appendChild(l);
    top.appendChild(typeSelect(q));
    card.appendChild(top);

    // a picture on the question, if it has one
    if (q.image) {
      var shot = el("div", "e-qimg");
      var im = el("img");
      im.src = imgUrl(q.image);
      im.alt = "Picture on this question";
      var side = el("div");
      var drop = el("button", null, "Remove picture");
      drop.type = "button";
      drop.addEventListener("click", function () { q.image = ""; q.imgAr = 0; saveNow(); paintEditor(); });
      side.appendChild(drop);
      shot.appendChild(im);
      shot.appendChild(side);
      card.appendChild(shot);
    }
    var upNote = el("div", "e-up");
    upNote.id = "up_" + q.id;
    card.appendChild(upNote);

    // the answer area
    var area = el("div");
    area.style.marginTop = "16px";
    if (q.type === "photo") {
      var pn = el("div", "e-photo");
      pn.appendChild(svg(ICON.photo));
      pn.appendChild(el("span", null, "The hunter sends a photo. Any photo counts as the answer, and it turns up on the Responses tab."));
      area.appendChild(pn);
    } else if (q.type === "short" || q.type === "para") {
      area.appendChild(acceptedAnswers(q));
    } else {
      area.appendChild(optionList(q));
    }
    card.appendChild(area);

    // advanced strip
    if (E.adv[q.id]) card.appendChild(advanced(q));

    // footer
    var foot = el("div", "e-foot");
    // A question nobody can get right is worth saying out loud: the hunt stops dead
    // on it, and the only place that shows is here.
    var hasKey = q.type === "photo" ? true
               : (q.type === "short" || q.type === "para") ? q.answers.length > 0
               : q.correct.length > 0;
    var key = el("div", "e-keyline" + (hasKey ? "" : " warn"), keyLine(q));
    foot.appendChild(key);
    foot.appendChild(el("div", "spacer"));
    var up = iconBtn(ICON.up, "Move up");
    up.disabled = i === 0;
    up.addEventListener("click", function () { if (i === 0) return; var m = E.form.questions.splice(i, 1)[0]; E.form.questions.splice(i - 1, 0, m); saveNow(); paintEditor(); });
    var dn = iconBtn(ICON.down, "Move down");
    dn.disabled = i === E.form.questions.length - 1;
    dn.addEventListener("click", function () { if (i >= E.form.questions.length - 1) return; var m = E.form.questions.splice(i, 1)[0]; E.form.questions.splice(i + 1, 0, m); saveNow(); paintEditor(); });
    var pic = iconBtn(ICON.image, q.image ? "Replace the picture" : "Add a picture");
    var picker = el("input");
    picker.type = "file";
    picker.accept = "image/*";
    picker.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;";
    pic.addEventListener("click", function () { picker.click(); });
    picker.addEventListener("change", function () {
      var f = picker.files && picker.files[0];
      picker.value = "";
      if (!f) return;
      var note = $("up_" + q.id);
      if (note) { note.className = "e-up"; note.textContent = "Getting that picture ready..."; }
      shrink(f, function (payload, err) {
        if (!payload) { if (note) { note.className = "e-up bad"; note.textContent = err; } return; }
        if (note) note.textContent = "Uploading...";
        uploadImage(payload, function (res, err2) {
          if (!res) { if (note) { note.className = "e-up bad"; note.textContent = err2; } return; }
          q.image = res.id;
          q.imgAr = Math.round(res.ar * 1000) / 1000;
          saveNow();
          paintEditor();
        });
      });
    });
    var dup = iconBtn(ICON.copy, "Duplicate");
    dup.addEventListener("click", function () {
      var c = JSON.parse(JSON.stringify(q));
      c.id = newId();
      E.form.questions.splice(i + 1, 0, c);
      E.sel = c.id; saveNow(); paintEditor();
    });
    var del = iconBtn(ICON.trash, "Delete");
    del.addEventListener("click", function () {
      E.form.questions.splice(i, 1);
      saveNow(); paintEditor();
    });
    var adv = iconBtn(ICON.more, "More settings for this question");
    adv.addEventListener("click", function () { E.adv[q.id] = !E.adv[q.id]; paintEditor(); });
    [pic, up, dn, dup, del, adv].forEach(function (b) { foot.appendChild(b); });
    foot.appendChild(picker);
    card.appendChild(foot);
    return card;
  }

  function keyLine(q) {
    if (q.type === "photo") return "Any photo counts";
    if (q.type === "short" || q.type === "para") {
      if (!q.answers.length) return "No accepted answer yet";
      return q.answers.length === 1 ? "Answer: " + q.answers[0] : q.answers.length + " accepted answers";
    }
    if (!q.correct.length) return "No correct option picked yet";
    return "Correct: " + q.correct.map(function (n) { return q.options[n]; }).join(", ");
  }

  function typeSelect(q) {
    var wrap = el("div", "e-sel");
    var btn = el("button", "e-sel-btn");
    btn.type = "button";
    btn.setAttribute("aria-haspopup", "true");
    btn.appendChild(svg(TYPE_ICONS[q.type]));
    btn.appendChild(el("span", null, TYPE_NAMES[q.type]));
    btn.appendChild(svg(ICON.down));
    var menu = null;
    function close() { if (menu) { menu.remove(); menu = null; } }
    btn.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (menu) { close(); return; }
      menu = el("div", "e-menu");
      Object.keys(TYPE_NAMES).forEach(function (t, idx) {
        if (idx === 2) menu.appendChild(el("hr"));
        var b = el("button");
        b.type = "button";
        b.appendChild(svg(TYPE_ICONS[t]));
        b.appendChild(el("span", null, TYPE_NAMES[t]));
        b.addEventListener("click", function () { changeType(q, t); close(); });
        menu.appendChild(b);
      });
      wrap.appendChild(menu);
      document.addEventListener("click", close, { once: true });
    });
    wrap.appendChild(btn);
    return wrap;
  }

  function changeType(q, t) {
    var CHOICE = { mc: 1, check: 1, drop: 1 };
    var wasChoice = !!CHOICE[q.type];
    var isChoice = !!CHOICE[t];
    q.type = t;
    if (isChoice && !q.options.length) { q.options = ["Option 1"]; q.correct = []; }
    if (isChoice && !wasChoice) q.correct = [];
    if (t !== "check" && q.correct.length > 1) q.correct = [q.correct[0]];
    saveNow(); paintEditor();
  }

  function optionList(q) {
    var box = el("div");
    q.options.forEach(function (o, i) {
      var row = el("div", "e-opt" + (q.type === "check" ? " box" : ""));
      if (q.type === "drop") row.appendChild(el("div", "num", (i + 1) + "."));
      else row.appendChild(el("div", "mk"));
      row.appendChild(growInput("", "o_" + q.id + "_" + i, o, "Option " + (i + 1), function (v) { q.options[i] = v; markDirty(); }));
      var k = el("button", "e-key" + (q.correct.indexOf(i) >= 0 ? " on" : ""));
      k.type = "button";
      k.title = "Mark as the correct answer";
      k.setAttribute("aria-pressed", q.correct.indexOf(i) >= 0 ? "true" : "false");
      k.appendChild(svg(ICON.check));
      k.addEventListener("click", function () {
        var at = q.correct.indexOf(i);
        if (q.type === "check") { if (at >= 0) q.correct.splice(at, 1); else q.correct.push(i); q.correct.sort(function (a, b) { return a - b; }); }
        else q.correct = at >= 0 ? [] : [i];
        saveNow(); paintEditor();
      });
      row.appendChild(k);
      var x = el("button", "e-x");
      x.type = "button";
      x.title = "Remove option";
      x.appendChild(svg(ICON.close));
      x.addEventListener("click", function () {
        q.options.splice(i, 1);
        q.correct = q.correct.filter(function (n) { return n !== i; }).map(function (n) { return n > i ? n - 1 : n; });
        saveNow(); paintEditor();
      });
      if (q.options.length > 1) row.appendChild(x);
      box.appendChild(row);
    });
    var add = el("div", "e-add");
    if (q.type === "drop") add.appendChild(el("div", "num", (q.options.length + 1) + "."));
    else add.appendChild(el("div", "mk" + (q.type === "check" ? " box" : "")));
    var b = el("button", null, "Add option");
    b.type = "button";
    b.addEventListener("click", function () {
      q.options.push("Option " + (q.options.length + 1));
      saveNow(); paintEditor();
      setTimeout(function () { var n = $("o_" + q.id + "_" + (q.options.length - 1)); if (n) { n.focus(); n.select(); } }, 40);
    });
    add.appendChild(b);
    box.appendChild(add);
    return box;
  }

  function acceptedAnswers(q) {
    var box = el("div");
    var lab = el("div", "e-sub", q.answers.length ? "Accepted answers" : "Accepted answers (any one of them counts as right)");
    lab.style.margin = "0 0 6px";
    box.appendChild(lab);
    var chips = el("div", "e-chips");
    q.answers.forEach(function (a, i) {
      var chip = el("div", "e-chip");
      chip.appendChild(el("span", null, a));
      var x = el("button");
      x.type = "button";
      x.title = "Remove this answer";
      x.appendChild(svg(ICON.close));
      x.addEventListener("click", function () { q.answers.splice(i, 1); saveNow(); paintEditor(); });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
    var inp = el("input", "e-chipin");
    inp.id = "a_" + q.id;
    inp.placeholder = q.answers.length ? "Add another accepted answer" : "Type the answer, then press Enter";
    inp.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var v = inp.value.trim();
      if (!v) return;
      if (q.answers.indexOf(v) < 0) q.answers.push(v);
      inp.value = "";
      saveNow(); paintEditor();
      setTimeout(function () { var n = $("a_" + q.id); if (n) n.focus(); }, 40);
    });
    inp.addEventListener("blur", function () {
      var v = inp.value.trim();
      if (!v) return;
      if (q.answers.indexOf(v) < 0) { q.answers.push(v); saveNow(); paintEditor(); }
    });
    chips.appendChild(inp);
    box.appendChild(chips);
    return box;
  }

  function advanced(q) {
    var box = el("div", "e-adv");
    var r1 = el("label");
    r1.appendChild(el("span", null, "Wait after a wrong answer"));
    var n = el("input");
    n.type = "number"; n.min = "0"; n.max = "600"; n.step = "1";
    n.id = "cd_" + q.id;
    n.value = q.cooldownMs === null ? "" : String(Math.round(q.cooldownMs / 1000));
    n.placeholder = String(Math.round((E.form.settings.cooldownMs || 0) / 1000));
    n.addEventListener("input", function () {
      q.cooldownMs = n.value === "" ? null : Math.max(0, Math.min(600, parseInt(n.value, 10) || 0)) * 1000;
      markDirty();
      var k = $("cdnote_" + q.id);
      if (k) k.textContent = q.cooldownMs === null ? "using the form default" : "just this question";
    });
    r1.appendChild(n);
    r1.appendChild(el("span", null, "seconds"));
    var note = el("span", null, q.cooldownMs === null ? "using the form default" : "just this question");
    note.id = "cdnote_" + q.id;
    note.style.color = "var(--dim)";
    r1.appendChild(note);
    box.appendChild(r1);

    var r2 = el("label");
    r2.appendChild(el("span", null, "Hint after a wrong answer"));
    var h = el("input", "wide");
    h.id = "hint_" + q.id;
    h.value = q.hint || "";
    h.placeholder = "Shown under the question once they get it wrong";
    h.addEventListener("input", function () { q.hint = h.value; markDirty(); });
    r2.appendChild(h);
    box.appendChild(r2);

    if (q.type === "short" || q.type === "para") {
      var r3 = el("label");
      var cb = el("input");
      cb.type = "checkbox";
      cb.checked = q.caseSensitive === true;
      cb.addEventListener("change", function () { q.caseSensitive = cb.checked ? true : null; saveNow(); });
      r3.appendChild(cb);
      r3.appendChild(el("span", null, "Capital letters have to match on this question"));
      box.appendChild(r3);
    }
    return box;
  }

  /* ---------- responses tab ---------- */

  // The shell is built once; the parts that change while you are looking at them
  // are refilled in place, so a hunter answering something does not throw the page
  // about under the pointer.
  function paintResponsesTab(body) {
    var stats = el("div", "e-stats");
    stats.id = "estats";
    body.appendChild(stats);

    var chartCard = el("div", "e-card");
    var boardNode = el("div");
    boardNode.id = "eboard";
    chartCard.appendChild(boardNode);
    body.appendChild(chartCard);

    var card = el("div", "e-card");
    var top = el("div");
    top.style.cssText = "display:flex;align-items:center;gap:12px;margin-bottom:8px;";
    var h = el("div", null);
    h.appendChild(el("div", "e-sec", "Who is hunting"));
    h.style.flex = "1";
    top.appendChild(h);
    var clearAll = el("button", "e-ghost", "Delete all responses");
    clearAll.type = "button";
    clearAll.addEventListener("click", function () {
      if (confirm("Delete every response? Everyone goes back to question 1.")) send({ type: "clearall" });
    });
    top.appendChild(clearAll);
    card.appendChild(top);
    var list = el("div");
    list.id = "elist";
    card.appendChild(list);
    body.appendChild(card);
    // the rows go in once this is actually in the document: fillResponses finds its
    // containers by id, and nothing is findable while the tab is still detached
  }

  function fillResponses() {
    var stats = $("estats"), list = $("elist");
    if (!stats || !list || !E.form) return;
    var total = E.form.questions.length;
    var done = E.players.filter(function (p) { return p.doneAt; }).length;
    var solved = E.players.reduce(function (a, p) { return a + p.solved; }, 0);

    stats.innerHTML = "";
    [[E.players.length, "started"], [done, "finished"],
     [E.players.length ? (solved / E.players.length).toFixed(1) : "0", "questions solved on average"]
    ].forEach(function (s) {
      var c = el("div", "e-stat");
      c.appendChild(el("b", null, String(s[0])));
      c.appendChild(el("i", null, s[1]));
      stats.appendChild(c);
    });

    list.innerHTML = "";
    if (!E.players.length) {
      list.appendChild(el("div", "e-empty", "Nobody has opened the form yet."));
      return;
    }
    E.players.forEach(function (p) {
      var row = el("div", "e-p");
      var av = el("div", "e-av", (p.name || "?").charAt(0).toUpperCase());
      av.style.background = SWATCHES[Math.abs(hash(p.uid)) % SWATCHES.length];
      row.appendChild(av);
      var who = el("div", "who");
      who.appendChild(el("b", null, p.name || "Anonymous"));
      who.appendChild(el("i", null, (p.wrong ? p.wrong + " wrong so far" : "no wrong answers") + " " + String.fromCharCode(183) + " " + ago(p.lastAt)));
      row.appendChild(who);
      var prog = el("div", "e-prog");
      var rail = el("div", "rail");
      var fill = el("i");
      fill.style.width = (total ? Math.round(p.solved / total * 100) : 0) + "%";
      rail.appendChild(fill);
      prog.appendChild(rail);
      prog.appendChild(el("small", null, p.solved + " of " + total));
      row.appendChild(prog);
      if (p.doneAt) row.appendChild(el("div", "e-done", "Finished"));
      var x = iconBtn(ICON.trash, "Delete this response");
      x.addEventListener("click", function () { send({ type: "clear", uid: p.uid }); });
      row.appendChild(x);
      list.appendChild(row);
      if (p.log && p.log.length) {
        var trail = el("div", "e-trail");
        p.log.forEach(function (e, i) {
          var d = el("div");
          d.innerHTML = (i + 1) + ". " + esc(e.title) + " &#183; <b style='font-weight:500'>" + esc(e.given) + "</b>";
          if (e.img) {
            var th = el("img");
            th.src = imgUrl(e.img);
            th.alt = "Photo sent for " + e.title;
            th.style.marginLeft = "8px";
            d.appendChild(th);
          }
          trail.appendChild(d);
        });
        list.appendChild(trail);
      }
    });
  }
  function hash(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

  /* ---------- settings tab ---------- */

  function toggleRow(title, note, val, onChange) {
    var row = el("div", "e-set");
    var t = el("div", "t");
    t.appendChild(el("b", null, title));
    if (note) t.appendChild(el("i", null, note));
    row.appendChild(t);
    var b = el("button", "e-tog" + (val ? " on" : ""));
    b.type = "button";
    b.setAttribute("role", "switch");
    b.setAttribute("aria-checked", val ? "true" : "false");
    b.setAttribute("aria-label", title);
    b.addEventListener("click", function () { onChange(!val); });
    row.appendChild(b);
    return row;
  }

  function paintSettingsTab(body) {
    var f = E.form, s = f.settings;

    var c1 = el("div", "e-card");
    c1.appendChild(el("div", "e-sec", "The hunt"));
    c1.appendChild(el("p", "e-sub", "How the form behaves while somebody is working through it."));

    var cdRow = el("div", "e-set");
    var cdT = el("div", "t");
    cdT.appendChild(el("b", null, "Wait after a wrong answer"));
    cdT.appendChild(el("i", null, "The cooldown before the next try. A question can override this in its own settings."));
    cdRow.appendChild(cdT);
    var num = el("div", "e-num");
    var cdIn = el("input");
    cdIn.id = "s_cool";
    cdIn.type = "number"; cdIn.min = "0"; cdIn.max = "600";
    cdIn.value = String(Math.round((s.cooldownMs || 0) / 1000));
    cdIn.addEventListener("input", function () {
      s.cooldownMs = Math.max(0, Math.min(600, parseInt(cdIn.value, 10) || 0)) * 1000;
      markDirty();
    });
    num.appendChild(cdIn);
    num.appendChild(el("span", null, "seconds"));
    cdRow.appendChild(num);
    c1.appendChild(cdRow);

    c1.appendChild(toggleRow("Capital letters have to match", "Off means SCIENCE, Science and science are all the same answer.",
      s.caseSensitive, function (v) { s.caseSensitive = v; saveNow(); paintEditor(); }));
    c1.appendChild(toggleRow("Show a hint after a wrong answer", "Only questions that have a hint written will show one.",
      s.showHints, function (v) { s.showHints = v; saveNow(); paintEditor(); }));
    c1.appendChild(toggleRow("Ask for a name first", "The name shows up on the Responses tab.",
      s.askName, function (v) { s.askName = v; saveNow(); paintEditor(); }));
    c1.appendChild(toggleRow("Show the question counter", "Question 3 of 6, under the answer.",
      s.showCount, function (v) { s.showCount = v; saveNow(); paintEditor(); }));
    c1.appendChild(toggleRow("Show the standings", "The graph of who has found what, and the QR code for joining. Everyone on the form can see it.",
      s.showBoard !== false, function (v) { s.showBoard = v; saveNow(); paintEditor(); }));
    body.appendChild(c1);

    var c2 = el("div", "e-card");
    c2.appendChild(el("div", "e-sec", "Theme"));
    c2.appendChild(el("p", "e-sub", "The colour runs through the header band, the buttons and the page behind them."));
    var sw = el("e-sw");
    sw = el("div", "e-sw");
    SWATCHES.forEach(function (hex) {
      var b = el("button", f.theme === hex ? "on" : "");
      b.type = "button";
      b.style.background = hex;
      b.title = hex;
      b.setAttribute("aria-label", "Theme colour " + hex);
      b.addEventListener("click", function () { f.theme = hex; applyTheme(hex); saveNow(); paintEditor(); });
      sw.appendChild(b);
    });
    c2.appendChild(sw);
    body.appendChild(c2);

    var c3 = el("div", "e-card");
    c3.appendChild(el("div", "e-sec", "When they finish"));
    c3.appendChild(el("p", "e-sub", "The last screen, once every question is right."));
    var t1 = growInput("q", "s_ftitle", s.finishTitle, "Confirmation heading", function (v) { s.finishTitle = v; markDirty(); });
    var t2 = growInput("", "s_fnote", s.finishNote, "Anything else they should see", function (v) { s.finishNote = v; markDirty(); });
    c3.appendChild(t1); c3.appendChild(t2);
    body.appendChild(c3);

    var c4 = el("div", "e-card");
    c4.appendChild(el("div", "e-sec", "Sharing"));
    c4.appendChild(el("p", "e-sub", "One form for the whole site. Everyone sees the same questions, and an edit here reaches open pages straight away."));
    var link = el("div");
    link.style.cssText = "font:14px/20px var(--sans);color:var(--ink-2);word-break:break-all;";
    link.textContent = location.origin + "/form";
    c4.appendChild(link);
    body.appendChild(c4);
  }

  /* ---------- boot ---------- */
  applyTheme("#673ab7");
  paint();
  connect();
  if (new URLSearchParams(location.search).get("edit") === "1") openEditor();

  window.addEventListener("keydown", function (e) {
    if (mode === "editor" && (e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveNow(); }
  });
  // The graph is drawn at the width it actually has, so turning a phone on its side
  // has to redraw it rather than stretch it.
  var reflow = null;
  window.addEventListener("resize", function () {
    clearTimeout(reflow);
    reflow = setTimeout(paintBoard, 200);
  });
  window.__form = { state: function () { return S; }, editor: function () { return E; } };
})();
</script>
</body>
</html>
