<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scavenger Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* Google Forms, near enough: its measurements, its type, its manners. Google Sans
     is Google's own and not ours to ship, so the display stack falls back to Roboto,
     which is what Forms itself falls back to and reads almost identically here.
     The page tint, the button and every accent are derived from one theme colour,
     the way a Forms theme works, so changing it in the editor changes the lot. */
  :root {
    --theme:   #673ab7;
    --theme-d: #5b2ea3;   /* the same colour pressed */
    --tint:    #f0ebf8;   /* the page behind the cards */
    --ink:     #202124;
    --ink-2:   #5f6368;
    --dim:     #70757a;
    --line:    #dadce0;
    --err:     #d93025;
    --ok:      #188038;
    --card:    #fff;
    --sans: Roboto, "Helvetica Neue", Arial, sans-serif;
    --disp: "Google Sans", "Product Sans", Roboto, Arial, sans-serif;
    --shadow: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--tint);
    color: var(--ink);
    font: 400 14px/20px var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--theme); }
  :focus-visible { outline: 2px solid var(--theme); outline-offset: 2px; }
  .hide { display: none !important; }
  .svg { width: 24px; height: 24px; fill: currentColor; display: block; }

  /* ============================== the form ============================== */

  .f-wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 48px; }
  .f-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
  }
  /* the band rounds itself rather than being clipped by the card: a dropdown menu
     has to be able to hang outside the card it opens in */
  .f-band { height: 10px; background: var(--theme); border-radius: 7px 7px 0 0; }
  .f-pad { padding: 24px; }
  .f-title {
    font: 400 32px/135% var(--disp);
    letter-spacing: 0;
    margin: 0;
    word-break: break-word;
  }
  .f-desc { margin: 12px 0 0; font: 400 14px/20px var(--sans); color: var(--ink); white-space: pre-wrap; }
  .f-rule { border-top: 1px solid var(--line); margin: 24px -24px 0; }
  .f-req { margin-top: 12px; font-size: 12px; color: var(--err); }

  .f-q-title { font: 400 16px/24px var(--sans); margin: 0; word-break: break-word; }
  .f-star { color: var(--err); }
  .f-help { margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--dim); white-space: pre-wrap; }
  .f-field { margin-top: 20px; }

  /* short answer: an underline that thickens into the theme colour on focus */
  .f-line { position: relative; max-width: 100%; }
  .f-short { width: 100%; max-width: 340px; }
  .f-para  { width: 100%; }
  .f-input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 0 0 8px;
    font: 400 14px/20px var(--sans);
    resize: none;
  }
  .f-input::placeholder { color: var(--dim); }
  .f-input:focus { outline: none; }
  .f-line::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--theme);
    transform: scaleX(0); transform-origin: center;
    transition: transform .18s ease;
  }
  .f-line.on::after { transform: scaleX(1); }
  .f-line.bad::after { background: var(--err); transform: scaleX(1); }

  /* choices */
  .f-opt {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 0; cursor: pointer;
    position: relative;
  }
  .f-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .f-mark {
    flex: none; width: 20px; height: 20px; margin-top: 1px;
    border: 2px solid var(--ink-2); border-radius: 50%;
    position: relative; transition: border-color .12s ease;
  }
  .f-opt.box .f-mark { border-radius: 2px; }
  .f-opt:hover .f-mark { border-color: var(--ink); }
  .f-opt input:checked + .f-mark { border-color: var(--theme); }
  .f-opt input:checked + .f-mark::after {
    content: ""; position: absolute; inset: 2px;
    border-radius: 50%; background: var(--theme);
  }
  .f-opt.box input:checked + .f-mark { background: var(--theme); }
  .f-opt.box input:checked + .f-mark::after {
    content: ""; position: absolute; left: 4px; top: 0px;
    width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg); border-radius: 0; background: none; inset: auto;
  }
  .f-opt input:focus-visible + .f-mark { outline: 2px solid var(--theme); outline-offset: 3px; }
  .f-opt-txt { font: 400 14px/20px var(--sans); word-break: break-word; }

  /* dropdown, built by hand so the menu matches the rest */
  .f-drop { position: relative; max-width: 340px; }
  .f-drop-btn {
    width: 100%; text-align: left; background: transparent;
    border: 0; border-bottom: 1px solid var(--line);
    padding: 6px 28px 8px 0; cursor: pointer; color: var(--dim);
    font: 400 14px/20px var(--sans);
  }
  .f-drop-btn.set { color: var(--ink); }
  .f-caret { position: absolute; right: 0; bottom: 6px; color: var(--ink-2); pointer-events: none; }
  .f-menu {
    position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px);
    background: #fff; border-radius: 4px; box-shadow: var(--shadow);
    padding: 8px 0; max-height: 280px; overflow: auto;
  }
  .f-menu button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 10px 16px; font: 400 14px/20px var(--sans); cursor: pointer;
  }
  .f-menu button:hover, .f-menu button.on { background: #f1f3f4; }

  /* the answer verdict */
  .f-err { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--err); font-size: 12px; line-height: 16px; }
  .f-err .svg { width: 18px; height: 18px; }
  .f-hint { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--dim); }
  .f-card.right { box-shadow: inset 0 0 0 2px var(--ok); }

  /* the row under the card */
  .f-row { display: flex; align-items: center; gap: 16px; padding: 0 0 4px; flex-wrap: wrap; }
  .f-btn {
    background: var(--theme); color: #fff; border: 0; border-radius: 4px;
    height: 36px; padding: 0 24px; cursor: pointer;
    font: 500 14px/36px var(--disp); letter-spacing: .25px;
    transition: box-shadow .15s ease, background .15s ease;
  }
  .f-btn:hover { background: var(--theme-d); box-shadow: var(--shadow); }
  .f-btn[disabled] { background: #e8eaed; color: #9aa0a6; cursor: default; box-shadow: none; }
  .f-count { font-size: 14px; color: var(--ink); margin-left: auto; }
  .f-clear { background: none; border: 0; color: var(--theme); font: 500 14px/36px var(--disp); cursor: pointer; padding: 0 8px; border-radius: 4px; }
  .f-clear:hover { background: rgba(0,0,0,.04); background: color-mix(in srgb, var(--theme) 8%, transparent); }
  .f-bar { height: 4px; background: rgba(0,0,0,.08); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .f-bar i { display: block; height: 100%; background: var(--theme); width: 0; transition: width .3s ease; }

  .f-foot { margin-top: 28px; text-align: center; font-size: 11px; line-height: 16px; color: var(--dim); }
  .f-foot a { color: var(--dim); text-decoration: underline; }
  .f-foot .sep { margin: 0 6px; }

  .f-note { text-align: center; font-size: 12px; color: var(--dim); padding: 8px 0; }

  /* a question swapping for the next one */
  @keyframes f-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .f-anim { animation: f-in .22s ease both; }

  /* ============================= the editor ============================= */

  .e-bar {
    display: flex; align-items: center; gap: 12px;
    background: #fff; padding: 8px 16px; border-bottom: 1px solid transparent;
  }
  .e-logo { width: 40px; height: 40px; flex: none; }
  .e-name { flex: 1; min-width: 0; }
  .e-name input {
    border: 0; background: transparent; font: 400 18px/24px var(--disp);
    padding: 2px 4px; border-radius: 4px; width: 100%; max-width: 420px;
  }
  .e-name input:hover { box-shadow: inset 0 0 0 1px var(--line); }
  .e-name input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--theme); }
  .e-saved { font-size: 12px; color: var(--dim); padding: 2px 4px; height: 16px; }
  .e-acts { display: flex; align-items: center; gap: 4px; }
  .e-icon {
    width: 40px; height: 40px; border: 0; background: none; border-radius: 50%;
    display: grid; place-items: center; color: var(--ink-2); cursor: pointer;
  }
  .e-icon:hover { background: #f1f3f4; }
  .e-ghost {
    border: 0; background: none; color: var(--theme); border-radius: 4px;
    font: 500 14px/36px var(--disp); padding: 0 16px; cursor: pointer;
  }
  .e-ghost:hover { background: rgba(0,0,0,.04); background: color-mix(in srgb, var(--theme) 8%, transparent); }
  .e-tabs { background: #fff; display: flex; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(60,64,67,.15); }
  .e-tab {
    border: 0; background: none; padding: 14px 20px 12px; cursor: pointer;
    font: 500 14px/20px var(--disp); color: var(--ink-2); border-bottom: 3px solid transparent;
  }
  .e-tab:hover { background: #f8f9fa; }
  .e-tab.on { color: var(--theme); border-bottom-color: var(--theme); }
  .e-tab .pill {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    background: #f1f3f4; color: var(--ink-2); border-radius: 9px;
    font-size: 11px; line-height: 18px; text-align: center;
  }
  .e-body { max-width: 770px; margin: 0 auto; padding: 24px 16px 96px; }

  .e-card {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 12px; padding: 24px; position: relative;
  }
  .e-card.head { padding: 0; overflow: hidden; }
  .e-card.head .in { padding: 24px; }
  .e-card.sel { box-shadow: 0 2px 4px rgba(60,64,67,.15); }
  .e-card.sel::before {
    content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 6px;
    background: var(--theme); border-radius: 8px 0 0 8px;
  }
  .e-grab { display: grid; place-items: center; color: #dadce0; height: 16px; margin: -16px 0 6px; cursor: grab; }
  .e-card.drag { opacity: .4; }
  .e-card.over { box-shadow: 0 -3px 0 var(--theme); }

  .e-in {
    width: 100%; border: 0; border-bottom: 1px solid transparent;
    background: transparent; padding: 8px 12px; border-radius: 4px 4px 0 0;
    font: 400 14px/20px var(--sans); resize: none; overflow: hidden;
  }
  .e-in:hover { border-bottom-color: var(--line); background: #f8f9fa; }
  .e-in:focus { outline: none; background: #f8f9fa; border-bottom: 2px solid var(--theme); padding-bottom: 7px; }
  .e-in.big { font: 400 24px/32px var(--disp); }
  .e-in.q { font: 400 16px/24px var(--sans); }
  .e-in.small { font-size: 12px; color: var(--dim); }

  .e-top { display: flex; gap: 16px; align-items: flex-start; }
  .e-top .l { flex: 1; min-width: 0; }
  .e-sel {
    flex: none; width: 210px; position: relative;
  }
  .e-sel-btn {
    width: 100%; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
    padding: 0 12px; height: 48px; cursor: pointer; text-align: left;
    font: 400 14px/20px var(--sans);
  }
  .e-sel-btn:hover { background: #f8f9fa; }
  .e-sel-btn .svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
  .e-sel-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-menu {
    position: absolute; z-index: 40; right: 0; top: calc(100% + 4px); width: 260px;
    background: #fff; border-radius: 4px; box-shadow: var(--shadow); padding: 8px 0; overflow: hidden;
  }
  .e-menu button {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    background: none; border: 0; padding: 10px 16px; cursor: pointer; font: 400 14px/20px var(--sans);
  }
  .e-menu button:hover { background: #f1f3f4; }
  .e-menu .svg { width: 20px; height: 20px; color: var(--ink-2); }
  .e-menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

  .e-opt { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .e-opt .mk { flex: none; width: 20px; height: 20px; border: 2px solid #bdc1c6; border-radius: 50%; }
  .e-opt.box .mk { border-radius: 2px; }
  .e-opt .num { flex: none; width: 20px; color: var(--ink-2); font-size: 14px; text-align: center; }
  .e-opt .e-in { flex: 1; }
  .e-key {
    flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: none;
    display: grid; place-items: center; cursor: pointer; color: #bdc1c6;
  }
  .e-key:hover { background: #f1f3f4; color: var(--ok); }
  .e-key.on { color: var(--ok); }
  .e-x { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
  .e-x:hover { background: #f1f3f4; }
  .e-add { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .e-add .mk { flex: none; width: 20px; height: 20px; border: 2px solid #e0e0e0; border-radius: 50%; }
  .e-add .mk.box { border-radius: 2px; }
  .e-add button { border: 0; background: none; color: var(--dim); padding: 8px 12px; cursor: pointer; border-radius: 4px; font: 400 14px/20px var(--sans); }
  .e-add button:hover { background: #f8f9fa; color: var(--ink); }

  .e-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .e-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #e6f4ea; color: #137333; border-radius: 16px;
    padding: 5px 6px 5px 12px; font-size: 13px; max-width: 100%;
  }
  .e-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-chip button { border: 0; background: none; color: #137333; cursor: pointer; display: grid; place-items: center; padding: 0; border-radius: 50%; width: 20px; height: 20px; }
  .e-chip button:hover { background: rgba(19,115,51,.12); }
  .e-chipin { border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 4px; min-width: 160px; flex: 1; }
  .e-chipin:focus { outline: none; border-bottom: 2px solid var(--theme); padding-bottom: 5px; }

  .e-foot { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); margin: 20px -24px -8px; padding: 8px 16px 0; }
  .e-foot .spacer { flex: 1; }
  .e-keyline.warn { color: var(--err); }
  .e-keyline { font-size: 12px; color: var(--ok); padding-left: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-adv { border-top: 1px solid var(--line); margin: 16px -24px 0; padding: 16px 24px 0; display: grid; gap: 12px; }
  .e-adv label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .e-adv input[type=number] { width: 88px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .e-adv .wide { flex: 1; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; }
  .e-adv .wide:focus { outline: none; border-bottom: 2px solid var(--theme); padding-bottom: 5px; }

  .e-fab {
    position: fixed; right: max(16px, calc(50% - 470px)); top: 140px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    display: grid; padding: 4px; gap: 4px; box-shadow: 0 1px 2px rgba(60,64,67,.15);
  }
  .e-fab button { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); cursor: pointer; }
  .e-fab button:hover { background: #f1f3f4; }

  /* settings + responses */
  .e-sec { font: 500 16px/24px var(--disp); margin: 0 0 4px; }
  .e-sub { font-size: 12px; color: var(--dim); margin: 0 0 16px; }
  .e-set { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .e-set:first-of-type { border-top: 0; }
  .e-set .t { flex: 1; min-width: 0; }
  .e-set .t b { display: block; font-weight: 400; font-size: 14px; }
  .e-set .t i { display: block; font-style: normal; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .e-tog { flex: none; width: 36px; height: 14px; border-radius: 7px; background: #bdc1c6; border: 0; position: relative; cursor: pointer; padding: 0; }
  .e-tog::after { content: ""; position: absolute; left: -2px; top: -3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s ease, background .15s ease; }
  .e-tog.on { background: rgba(103,58,183,.5); background: color-mix(in srgb, var(--theme) 45%, #fff); }
  .e-tog.on::after { transform: translateX(22px); background: var(--theme); }
  .e-num { display: flex; align-items: center; gap: 8px; }
  .e-num input { width: 92px; border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .e-num select { border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: #fff; }
  .e-sw { display: flex; flex-wrap: wrap; gap: 10px; }
  .e-sw button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .e-sw button.on { border-color: var(--ink); }

  .e-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .e-stat { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .e-stat b { display: block; font: 400 28px/34px var(--disp); }
  .e-stat i { font-style: normal; font-size: 12px; color: var(--dim); }
  .e-p { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .e-p:first-child { border-top: 0; }
  .e-av { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 500 14px/32px var(--disp); }
  .e-p .who { flex: 1; min-width: 0; }
  .e-p .who b { display: block; font-weight: 400; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-p .who i { font-style: normal; font-size: 12px; color: var(--dim); }
  .e-prog { flex: none; width: 120px; }
  .e-prog .rail { height: 4px; background: #e8eaed; border-radius: 2px; overflow: hidden; }
  .e-prog .rail i { display: block; height: 100%; background: var(--theme); }
  .e-prog small { font-size: 11px; color: var(--dim); }
  .e-done { flex: none; background: #e6f4ea; color: #137333; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .e-trail { font-size: 12px; color: var(--ink-2); padding: 0 0 12px 44px; }
  .e-trail div { padding: 2px 0; }
  .e-empty { text-align: center; color: var(--dim); padding: 40px 16px; font-size: 14px; }

  /* sign in */
  .e-in-wrap { max-width: 450px; margin: 48px auto; padding: 0 16px; }
  .e-signin { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 40px 40px 32px; text-align: center; }
  .e-signin h2 { font: 400 24px/32px var(--disp); margin: 16px 0 8px; }
  .e-signin p { color: var(--ink-2); font-size: 14px; margin: 0 0 28px; }
  .e-signin .fld { position: relative; text-align: left; margin-bottom: 8px; }
  .e-signin input {
    width: 100%; height: 56px; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 15px; font-size: 16px; background: #fff;
  }
  .e-signin input:focus { outline: none; border: 2px solid var(--theme); padding: 0 14px; }
  .e-signin .bad-msg { color: var(--err); font-size: 12px; text-align: left; min-height: 18px; padding: 4px 2px; }
  .e-signin .go { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }

  .e-back { position: fixed; left: 16px; bottom: 16px; z-index: 50; }
  .e-back button {
    border: 0; background: var(--ink); color: #fff; border-radius: 20px;
    height: 40px; padding: 0 20px; cursor: pointer; box-shadow: var(--shadow);
    font: 500 14px/40px var(--disp);
  }

  /* ---- pictures: on a question, and as an answer ---- */
  .f-qimg { display: block; max-width: 100%; height: auto; border-radius: 4px; margin: 16px 0 0; }
  .f-file { margin-top: 16px; }
  .f-file input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .f-pick {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: #fff; border-radius: 4px;
    height: 36px; padding: 0 16px; cursor: pointer; color: var(--theme);
    font: 500 14px/36px var(--disp);
  }
  .f-pick:hover { background: rgba(0,0,0,.03); }

        if (mode === "editor") { paintTabsOnly(); if (E.tab === "r") fillResponses(); }
        return;
      }
      E.form = clone(m.form);
      if (mode === "editor") paintEditor(); else paint();
      return;
    }
    if (m.type === "players") {
      E.players = m.players || [];
      if (mode === "editor") { paintTabsOnly(); if (E.tab === "r") fillResponses(); }
      return;
    }
    if (m.type === "nope") {
      signinError = m.locked ? "Too many tries. Reload the page to try again."
                  : m.slow ? "Slow down a moment, then try again."
                  : "Wrong password.";
      pendingPw = "";
      paint();
      return;
    }
    if (m.type === "loggedout") { mode = "view"; E.form = null; paint(); return; }
  }

  function applyState(m) {
    var wasQ = S.q ? S.q.id : null;
    S.head = m.head; S.settings = m.settings; S.total = m.total; S.you = m.you; S.q = m.q; S.v = m.v;
    if (typeof m.here === "number") S.here = m.here;
    applyTheme(S.head.theme);
    document.title = S.head.title || "Form";
    if (S.you.until > Date.now()) { verdict = { bad: true, until: S.you.until, hint: (verdict && verdict.hint) || "" }; startTick(); }
    if (S.q && S.q.id !== wasQ) verdict = null;
    if (S.you.name) myName = S.you.name;
    // The editor is a viewer too, so its own saves come back here. Repainting then
    // would tear down whatever it has open, and the editor repaints itself anyway.
    if (mode === "view") paint();
  }

  function flashRight() {
    var card = $("qcard");
    if (!card) return;
    card.classList.add("right");
    holdState = true;
    setTimeout(function () {
      var held = holdState;
      holdState = null;
      card.classList.remove("right");
      if (held && held !== true) applyState(held);
    }, 420);
  }

  function startTick() {
    if (tick) return;
    tick = setInterval(function () {
      if (!verdict || !verdict.until || verdict.until <= Date.now()) {
        clearInterval(tick); tick = null;
        if (verdict && verdict.until) { verdict.until = 0; paintQuestion(); }
        return;
      }
      paintCountdown();
    }, 250);
  }
  function left() {
    if (!verdict || !verdict.until) return 0;
    return Math.max(0, Math.ceil((verdict.until - Date.now()) / 1000));
  }

  /* ====================================================================== */
  /*  the form                                                              */
  /* ====================================================================== */

  function paint() {
    if (mode === "editor") { $("view").classList.add("hide"); $("edit").classList.remove("hide"); paintEditor(); return; }
    if (mode === "signin") { $("view").classList.add("hide"); $("edit").classList.remove("hide"); paintSignin(); return; }
    $("edit").classList.add("hide");
    $("view").classList.remove("hide");
    paintForm();
  }

  function paintForm() {
    var root = $("view");
    root.innerHTML = "";
    var wrap = el("div", "f-wrap");

    // header card
    var head = el("div", "f-card");
    head.appendChild(el("div", "f-band"));
    var pad = el("div", "f-pad");
    var h1 = el("h1", "f-title", S.head.title || (live ? "Untitled form" : "Loading"));
    pad.appendChild(h1);
    if (S.head.description) pad.appendChild(el("p", "f-desc", S.head.description));
    if (!S.you.done && S.total) {
      pad.appendChild(el("div", "f-rule"));
      pad.appendChild(el("div", "f-req", "* Required"));
    }
    head.appendChild(pad);
    wrap.appendChild(head);

    var stage = el("div");
    stage.id = "stage";
    wrap.appendChild(stage);

    // footer
    var foot = el("div", "f-foot");
    foot.appendChild(document.createTextNode("Never submit passwords through this form."));
    foot.appendChild(el("br"));
    var line2 = el("div");
    line2.innerHTML = "A page on leonzhao.dev, built in the style of Google Forms. Not a Google product." ;
    foot.appendChild(line2);
    var line3 = el("div");
    line3.style.marginTop = "6px";
    var eLink = el("a", null, "Editor");
    eLink.href = "?edit=1";
    eLink.addEventListener("click", function (ev) { ev.preventDefault(); openEditor(); });
    line3.appendChild(eLink);
    line3.appendChild(el("span", "sep", "·"));
    var here = el("span", null, String(S.here || 1));
    here.id = "here";
    line3.appendChild(here);
    line3.appendChild(document.createTextNode(" on this form now"));
    foot.appendChild(line3);
    wrap.appendChild(foot);

    root.appendChild(wrap);

    if (mode === "editor" || previewing) {
      var back = el("div", "e-back");
      var b = el("button", null, "Back to editing");
      b.type = "button";
      b.addEventListener("click", function () { previewing = false; mode = "editor"; paint(); });
      back.appendChild(b);
      root.appendChild(back);
    }
    paintStage();
  }

  function paintStage() {
    var stage = $("stage");
    if (!stage) return;
    stage.innerHTML = "";
    if (!live && !S.total) { stage.appendChild(noteCard("Connecting to the form...")); return; }
    if (!S.total) { stage.appendChild(noteCard("This form has no questions yet.")); return; }
    if (S.settings.askName && !S.you.name && !nameDone && S.you.solved === 0) { stage.appendChild(nameCard()); return; }
    if (S.you.done) stage.appendChild(doneCard());
    else stage.appendChild(questionBlock());
    if (S.settings.showBoard !== false) {
      stage.appendChild(boardCard());
      paintBoard();          // filled once it is in the document: the graph measures itself
    }
  }

  function boardCard() {
    var c = el("div", "f-card");
    var pad = el("div", "f-pad");
    var node = el("div");
    node.id = "board";
    pad.appendChild(node);
    c.appendChild(pad);
    return c;
  }
  function paintQuestion() { paintStage(); }

  function noteCard(text) {
    var c = el("div", "f-card");
    var p = el("div", "f-pad");
    p.appendChild(el("div", "f-note", text));
    c.appendChild(p);
    return c;
  }

  function nameCard() {
    var frag = document.createDocumentFragment();
    var c = el("div", "f-card f-anim");
    var pad = el("div", "f-pad");
    pad.appendChild(el("div", "f-q-title", "Your name"));
    pad.appendChild(el("p", "f-help", "So the hunt knows who got there. Leave it blank to stay anonymous."));
    var f = el("div", "f-field");
    var line = el("div", "f-line f-short");
    var inp = el("input", "f-input");
    inp.type = "text"; inp.maxLength = 24; inp.placeholder = "Your answer"; inp.value = myName || "";
    inp.addEventListener("focus", function () { line.classList.add("on"); });
    inp.addEventListener("blur", function () { line.classList.remove("on"); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
    line.appendChild(inp);
    f.appendChild(line);
    pad.appendChild(f);
    c.appendChild(pad);
    frag.appendChild(c);

    var row = el("div", "f-row");

    btn.addEventListener("click", go);
    row.appendChild(btn);
    frag.appendChild(row);

    function go() {
      myName = inp.value.trim();
      store("form_name", myName);
      store("form_named", "1");
      send({ type: "name", name: myName });
      nameDone = true;
      paintStage();
    }
    setTimeout(function () { inp.focus(); }, 30);
    return frag;
  }

  function doneCard() {
    var frag = document.createDocumentFragment();
    var c = el("div", "f-card f-anim");
    var pad = el("div", "f-pad");
    pad.appendChild(el("div", "f-title", S.settings.finishTitle || "Your response has been recorded."));
    if (S.settings.finishNote) pad.appendChild(el("p", "f-desc", S.settings.finishNote));
    if (S.you.log && S.you.log.length) {
      pad.appendChild(el("div", "f-rule"));
      var list = el("div");
      list.style.marginTop = "16px";
      S.you.log.forEach(function (e, i) {
        var r = el("div");

        var n = el("span", null, (i + 1) + ".");

        r.appendChild(n); r.appendChild(t);

          th.src = imgUrl(e.img);

        }

      });
      pad.appendChild(list);
    }
    var again = el("div");
    again.style.marginTop = "20px";
    var a = el("a", null, "Submit another response");
    a.href = "#";
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      nameDone = false; draft = {}; verdict = null;
      send({ type: "restart" });
    });
    again.appendChild(a);
    pad.appendChild(again);
    c.appendChild(pad);
    frag.appendChild(c);
    return frag;
  }

  function questionBlock() {
    var q = S.q;
    var frag = document.createDocumentFragment();
    var c = el("div", "f-card f-anim");
    c.id = "qcard";
    var pad = el("div", "f-pad");

    var t = el("div", "f-q-title");
    t.appendChild(document.createTextNode(q.title));
    t.appendChild(el("span", "f-star", " *"));
    pad.appendChild(t);
    if (q.help) pad.appendChild(el("p", "f-help", q.help));
    if (q.image) {
      var qim = el("img", "f-qimg");
      qim.src = imgUrl(q.image);
      qim.alt = "Picture for this question";
      if (q.imgAr) qim.style.aspectRatio = String(q.imgAr);
      // a picture that will not load leaves no hole where it would have been
      qim.addEventListener("error", function () { qim.style.display = "none"; });
      pad.appendChild(qim);
    }

    var field = el("div", "f-field");
    var current = draft[q.id];
    var getValue;

    if (q.type === "short" || q.type === "para") {
      var line = el("div", "f-line " + (q.type === "para" ? "f-para" : "f-short"));
      var inp = q.type === "para" ? el("textarea", "f-input") : el("input", "f-input");
      if (q.type === "para") { inp.rows = 3; } else { inp.type = "text"; }
      inp.maxLength = 300;
      inp.placeholder = "Your answer";
      inp.value = typeof current === "string" ? current : "";
      inp.addEventListener("focus", function () { line.classList.add("on"); });
      inp.addEventListener("blur", function () { line.classList.remove("on"); });
      inp.addEventListener("input", function () { draft[q.id] = inp.value; });
      if (q.type === "short") {
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } });
      }
      if (verdict && verdict.bad) line.classList.add("bad");
      line.appendChild(inp);
      field.appendChild(line);
      getValue = function () { return inp.value; };
      setTimeout(function () { if (!verdict || !verdict.until) inp.focus(); }, 30);

    } else if (q.type === "photo") {
      // A photo is the answer. Nothing can mark it automatically, so sending one
      // counts, and the editor looks at what arrived on the Responses tab.
      var got = (current && current.id) ? current : null;
      var box = el("div", "f-file");
      var input = el("input");
      input.type = "file";
      input.accept = "image/*";
      input.id = "photo_" + q.id;
      var pick = el("label", "f-pick");
      pick.setAttribute("for", input.id);
      pick.appendChild(svg(ICON.upload));
      pick.appendChild(document.createTextNode(got ? "Choose a different photo" : "Add photo"));
      var note = el("div", "f-hint");
      var shot = el("div", "f-shot");
      box.appendChild(input);
      box.appendChild(pick);
      box.appendChild(note);
      box.appendChild(shot);

      function showShot() {
        shot.innerHTML = "";
        if (!got) return;
        var im = el("img");
        im.src = imgUrl(got.id);
        im.alt = "The photo you are sending";
        var side = el("div");
        side.appendChild(el("div", "meta", "Ready to send"));
        var drop = el("button", null, "Remove");
        drop.type = "button";
        drop.addEventListener("click", function () {
          got = null; delete draft[q.id]; showShot();
          pick.lastChild.textContent = "Add photo";
        });
        side.appendChild(drop);
        shot.appendChild(im);
        shot.appendChild(side);
      }
      input.addEventListener("change", function () {
        var f = input.files && input.files[0];
        input.value = "";
        if (!f) return;
        note.textContent = "Getting that photo ready...";
        shrink(f, function (payload, err) {
          if (!payload) { note.textContent = err; return; }
          note.textContent = "Sending...";
          uploadImage(payload, function (res, err2) {
            if (!res) { note.textContent = err2; return; }
            got = { id: res.id };
            draft[q.id] = got;
            note.textContent = "";
            pick.lastChild.textContent = "Choose a different photo";
            showShot();
          });
        });
      });
      showShot();
      field.appendChild(box);
      getValue = function () { return got ? [got.id] : []; };

    } else if (q.type === "drop") {
      var picked = (Array.isArray(current) && current.length) ? current[0] : -1;
      var wrapD = el("div", "f-drop");
      var btn = el("button", "f-drop-btn" + (picked >= 0 ? " set" : ""));
      btn.type = "button";
      btn.setAttribute("aria-haspopup", "listbox");
      btn.setAttribute("aria-expanded", "false");
      btn.textContent = picked >= 0 ? q.options[picked] : "Choose";
      var caret = el("span", "f-caret");
      caret.appendChild(svg(ICON.down));
      wrapD.appendChild(btn); wrapD.appendChild(caret);
      var menu = null;
      function close() { if (menu) { menu.remove(); menu = null; btn.setAttribute("aria-expanded", "false"); } }
      btn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (menu) { close(); return; }
        menu = el("div", "f-menu");
        menu.setAttribute("role", "listbox");
        q.options.forEach(function (o, i) {
          var b = el("button", picked === i ? "on" : "", o);
          b.type = "button";
          b.setAttribute("role", "option");
          b.addEventListener("click", function () {
            picked = i; draft[q.id] = [i];
            btn.textContent = o; btn.classList.add("set");
            close();
          });
          menu.appendChild(b);
        });
        wrapD.appendChild(menu);
        btn.setAttribute("aria-expanded", "true");
        var first = menu.querySelector("button");
        if (first) first.focus();
        document.addEventListener("click", close, { once: true });
      });
      // Escape shuts the menu and puts the focus back where it came from, so a
      // keyboard is not trapped in a list it cannot leave.
      wrapD.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && menu) { ev.stopPropagation(); close(); btn.focus(); }
      });
      field.appendChild(wrapD);
      getValue = function () { return picked >= 0 ? [picked] : []; };

    } else {
      var multi = q.type === "check";
      var chosen = Array.isArray(current) ? current.slice() : [];
      q.options.forEach(function (o, i) {
        var lab = el("label", "f-opt" + (multi ? " box" : ""));
        var inp2 = el("input");
        inp2.type = multi ? "checkbox" : "radio";
        inp2.name = "q_" + q.id;
        inp2.checked = chosen.indexOf(i) >= 0;
        inp2.addEventListener("change", function () {
          if (multi) {
            var at = chosen.indexOf(i);
            if (inp2.checked && at < 0) chosen.push(i);
            if (!inp2.checked && at >= 0) chosen.splice(at, 1);
          } else {
            chosen = [i];
          }
          draft[q.id] = chosen.slice();
        });
        lab.appendChild(inp2);
        lab.appendChild(el("span", "f-mark"));
        lab.appendChild(el("span", "f-opt-txt", o));
        field.appendChild(lab);
      });
      getValue = function () { return chosen.slice(); };
    }
    pad.appendChild(field);

    // the verdict, in the place Forms puts its errors
    if (verdict && verdict.bad) {
      var e2 = el("div", "f-err");
      e2.id = "verdict";
      e2.appendChild(svg(ICON.bang));
      e2.appendChild(el("span", null, verdictText()));
      pad.appendChild(e2);
      if (verdict.hint) pad.appendChild(el("div", "f-hint", "Hint: " + verdict.hint));
    }
    c.appendChild(pad);
    frag.appendChild(c);

    // the button row, then the counter and the bar
    var row = el("div", "f-row");
    var last = q.n >= S.total;
    var go = el("button", "f-btn", last ? "Submit" : "Next");
    go.type = "button";
    go.id = "gobtn";
    go.addEventListener("click", submit);
    row.appendChild(go);
    var clear = el("button", "f-clear", "Clear form");
    clear.type = "button";
    clear.addEventListener("click", function () { delete draft[q.id]; verdict = null; paintStage(); });
    row.appendChild(clear);
    if (S.settings.showCount) row.appendChild(el("div", "f-count", "Question " + q.n + " of " + S.total));
    frag.appendChild(row);

    var bar = el("div", "f-bar");
    var fill = el("i");
    fill.style.width = (S.total ? Math.round((S.you.solved / S.total) * 100) : 0) + "%";
    bar.appendChild(fill);
    frag.appendChild(bar);

    if (verdict && verdict.until > Date.now()) go.disabled = true;

    function submit() {
      if (verdict && verdict.until > Date.now()) return;
      send({ type: "answer", qid: q.id, value: getValue() });
    }
    return frag;
  }

  function verdictText() {
    if (verdict.empty) return "This is a required question";
    var s = left();
    if (s > 0) return "Not quite. Try again in " + s + "s";
    return "Not quite. Try again";
  }
  function paintCountdown() {
    var v = $("verdict");
    if (!v) return;
    v.lastChild.textContent = verdictText();
    var b = $("gobtn");
    if (b) b.disabled = left() > 0;
  }

  /* ====================================================================== */
  /*  the standings                                                         */
  /* ====================================================================== */

  function sEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    return n;
  }
  function qrSvg() {
    var raw = atob(QR_BITS), n = QR_SIZE, quiet = 3, side = n + quiet * 2;
    var svg = sEl("svg", { viewBox: "0 0 " + side + " " + side, role: "img" });
    var t = sEl("title", {});
    t.textContent = "QR code for " + QR_URL;
    svg.appendChild(t);
    svg.appendChild(sEl("rect", { x: 0, y: 0, width: side, height: side, fill: "#fff" }));
    var d = "";
    for (var i = 0; i < n * n; i++) {
      var byte = raw.charCodeAt(i >> 3);
      if (!((byte >> (7 - (i & 7))) & 1)) continue;
      d += "M" + ((i % n) + quiet) + " " + (Math.floor(i / n) + quiet) + "h1v1h-1z";
    }
    svg.appendChild(sEl("path", { d: d, fill: "#202124" }));
    return svg;
  }

  // How far along somebody was at a given number of minutes in.
  function atMinute(row, t) {
    var k = 0;
    while (k < row.ts.length && row.ts[k] <= t) k++;
    return k;
  }
  function niceTop(v) {
    if (v <= 5) return Math.max(1, Math.ceil(v));
    var pow = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    return Math.ceil(v / (pow / 2)) * (pow / 2);
  }

  function chartInto(wrap, rows, total, youIdx) {
    // The viewBox is measured in real pixels rather than a fixed 640, so the axis
    // text is never scaled up on a phone or down on a wide screen.
    var W = Math.max(300, Math.round(wrap.clientWidth || 640));
    var H = W < 420 ? 190 : (rows.length > 6 ? 240 : 210);
    var padL = 26, padR = 14, padT = 10, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxT = 1;
    rows.forEach(function (r) {
      maxT = Math.max(maxT, r.now || 0, r.ts.length ? r.ts[r.ts.length - 1] : 0);
    });
    maxT = niceTop(maxT);
    var x = function (t) { return padL + (t / maxT) * plotW; };
    var y = function (v) { return padT + (1 - (total ? v / total : 0)) * plotH; };

    var svg = sEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "xMidYMid meet" });
    svg.setAttribute("aria-hidden", "true");

    // A gridline per question while they still read as separate lines, and only
    // three of them wear a number: the floor, the middle and the finish.
    var each = total <= 12 && plotH / Math.max(1, total) >= 12;
    var marks = [];
    if (each) { for (var i = 0; i <= total; i++) marks.push(i); }
    else {
      var step = Math.max(1, Math.round(total / 4));
      for (var i = 0; i <= total; i += step) marks.push(i);
      if (marks[marks.length - 1] !== total) marks.push(total);
    }
    var labelled = { 0: 1 };
    labelled[total] = 1;
    if (total >= 4) labelled[marks[Math.floor(marks.length / 2)]] = 1;
    marks.forEach(function (v) {
      var yy = y(v);
      svg.appendChild(sEl("line", { x1: padL, x2: W - padR, y1: yy, y2: yy, class: "b-grid" }));
      if (!labelled[v]) return;
      var lab = sEl("text", { x: padL - 6, y: yy + 4, "text-anchor": "end", class: "b-axis" });
      lab.textContent = String(v);
      svg.appendChild(lab);
    });
    // the finish line is the top gridline; say so once, on the right
    var fin = sEl("text", { x: W - padR, y: y(total) - 6, "text-anchor": "end", class: "b-axis" });
    fin.textContent = "all " + total + " found";
    svg.appendChild(fin);

    var t0 = sEl("text", { x: padL, y: H - 8, class: "b-axis" });
    t0.textContent = "0 min";
    svg.appendChild(t0);
    var t1 = sEl("text", { x: W - padR, y: H - 8, "text-anchor": "end", class: "b-axis" });
    t1.textContent = maxT + " min since each team started";
    svg.appendChild(t1);

    // grey field first, then the named hues, then yours, so yours is never buried
    var order = [];
    rows.forEach(function (r, i) { order.push({ r: r, i: i, c: colorOf(r.name) }); });
    order.sort(function (a, b) {
      var ar = (a.c === REST ? 0 : 1) + (a.i === youIdx ? 1 : 0);
      var br = (b.c === REST ? 0 : 1) + (b.i === youIdx ? 1 : 0);
      return ar - br;
    });
    var ends = [];
    order.forEach(function (o) {
      var r = o.r, mine = o.i === youIdx;
      var d = "M" + x(0) + " " + y(0);
      for (var k = 0; k < r.ts.length; k++) {
        d += "L" + x(r.ts[k]) + " " + y(k) + "L" + x(r.ts[k]) + " " + y(k + 1);
      }
      var endT = Math.max(r.now || 0, r.ts.length ? r.ts[r.ts.length - 1] : 0);
      d += "L" + x(endT) + " " + y(r.ts.length);
      svg.appendChild(sEl("path", { d: d, class: "b-line" + (o.c === REST ? " rest" : "") + (mine ? " mine" : ""), stroke: o.c }));
      if (o.c !== REST) {
        svg.appendChild(sEl("circle", { cx: x(endT), cy: y(r.ts.length), r: mine ? 5 : 4, fill: o.c, class: "b-dot" }));
        ends.push({ name: mine ? "You" : r.name, x: x(endT), y: y(r.ts.length), mine: mine });
      }
    });

    // Direct labels, but only where one actually fits. Teams sitting on the same
    // number is the normal case in a race, and stacking their names apart would
    // detach them from their lines, so a label that would land on top of one
    // already placed is simply left out. The legend and the table still name
    // everybody. Yours goes down first, because that is the one you look for.
    if (ends.length && ends.length <= 5) {
      var placed = [];
      ends.sort(function (a, b) { return (b.mine ? 1 : 0) - (a.mine ? 1 : 0); });
      ends.forEach(function (e) {
        for (var k = 0; k < placed.length; k++) {
          if (Math.abs(placed[k].y - e.y) < 16 && Math.abs(placed[k].x - e.x) < 120) return;
        }
        placed.push(e);
        var right = e.x < W - padR - 76;
        var lab = sEl("text", { x: e.x + (right ? 9 : -9), y: e.y + 4,
                                "text-anchor": right ? "start" : "end", class: "b-end" });
        lab.textContent = e.name.length > 14 ? e.name.slice(0, 13) + String.fromCharCode(8230) : e.name;
        svg.appendChild(lab);
      });
    }

    // the hover layer: a hairline that snaps to where the pointer is, and one
    // readout listing everybody at that minute
    var hair = sEl("line", { x1: 0, x2: 0, y1: padT, y2: padT + plotH, class: "b-hair" });
    hair.style.display = "none";
    svg.appendChild(hair);
    var hit = sEl("rect", { x: padL, y: padT, width: plotW, height: plotH, class: "b-hit" });
    svg.appendChild(hit);
    wrap.appendChild(svg);

    var tip = el("div", "b-tip");
    tip.style.display = "none";
    wrap.appendChild(tip);

    function move(ev) {
      var box = svg.getBoundingClientRect();
      var px = ((ev.clientX - box.left) / box.width) * W;
      if (px < padL || px > W - padR) return hide();
      var t = ((px - padL) / plotW) * maxT;
      hair.setAttribute("x1", px); hair.setAttribute("x2", px);
      hair.style.display = "";
      tip.innerHTML = "";
      var when = el("div", "when", (Math.round(t * 10) / 10) + " min in");
      tip.appendChild(when);
      var list = rows.map(function (r, i) { return { name: i === youIdx ? "You" : r.name, v: atMinute(r, t), c: colorOf(r.name) }; })
                     .sort(function (p, q) { return q.v - p.v; }).slice(0, 8);
      list.forEach(function (r) {
        var row = el("div", "row");
        var sw = el("i", "sw");
        sw.style.background = r.c;
        row.appendChild(sw);
        var v = el("b", null, String(r.v));
        row.appendChild(v);
        row.appendChild(document.createTextNode(" " + (r.name.length > 16 ? r.name.slice(0, 15) + String.fromCharCode(8230) : r.name)));
        tip.appendChild(row);
      });
      tip.style.display = "";
      var left = (px / W) * wrap.clientWidth + 12;
      if (left + tip.offsetWidth > wrap.clientWidth) left = (px / W) * wrap.clientWidth - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = "8px";
    }
    function hide() { hair.style.display = "none"; tip.style.display = "none"; }
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("pointercancel", hide);
  }

  function boardInto(node) {
    node.innerHTML = "";
    var rows = B.rows || [], total = B.total || S.total || 0;

    var top = el("div", "b-top");
    top.appendChild(el("h2", null, "How everyone is doing"));

    node.appendChild(top);

    if (rows.length && total) {
      var wrap = el("div", "b-chart");
      node.appendChild(wrap);
      chartInto(wrap, rows, total, B.you);

      var leg = el("div", "b-legend");
      var shown = {};
      rows.forEach(function (r, i) {
        var c = colorOf(r.name);
        if (c === REST || shown[r.name]) return;

        var s = el("span");
        var sw = el("i");
        sw.style.background = c;
        s.appendChild(sw);
        s.appendChild(document.createTextNode(i === B.you ? r.name + " (you)" : r.name));

      });
      var greys = rows.filter(function (r) { return colorOf(r.name) === REST; }).length;
      if (greys) {

        var gs = el("i");
        gs.style.background = REST;
        g.appendChild(gs);
        g.appendChild(document.createTextNode("everyone else (" + greys + ")"));
        leg.appendChild(g);
      }
      if (leg.childNodes.length > 1) node.appendChild(leg);
    } else {
      node.appendChild(el("div", "b-none", "Nobody has answered anything yet. The graph fills in as people go."));
    }

    var split = el("div", "b-split");

    var table = el("table", "b-table");
    var thead = el("thead");
    var hr = el("tr");
    ["", "Hunter", "Found", "Last one"].forEach(function (h, i) {
      var th = el("th", i >= 2 ? "num" : null, h);

      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tb = el("tbody");
    rows.forEach(function (r, i) {
      var tr = el("tr", i === B.you ? "mine" : null);
